# The seven suites, run where the app actually runs.
#
# windows-latest, and not as a preference. app/main.py guards its
# single-instance lock with msvcrt and returns -1 on a platform without file
# locking, which is a documented "guard skipped" state -- so the assertions in
# tests/test_smoke.py that a second instance refuses to start would fail on
# Linux for a reason that has nothing to do with the code under test. The
# window (pywebview on winforms), the tray (pystray's win32 backend) and the
# at-rest encryption (app/dpapi.py, crypt32 through ctypes.WinDLL) are Windows
# stacks as well, and app/dpapi.py guards them with sys.platform rather than
# pretending to work elsewhere.
#
# Not yet verified, and the reason is now known rather than assumed. GitHub
# registered this file as an active workflow (gh workflow list shows "tests
# active"), so the YAML is accepted -- but the push that added it created no
# run, because Actions is disabled at the repository level: the API reports
# {"enabled": false}. Enable it and the next push runs the job:
#
#   gh api -X PUT repos/camster91/rotman-lsm-calendar/actions/permissions \
#     -f enabled=true
#
# Until that is done this is a configuration, not a check. Do not read a green
# tick here as evidence the suites pass anywhere: they have been run on one
# machine, by hand, 708 assertions and no failures.
#
# Every suite ends in `return 1 if FAIL else 0` and sys.exit(main()), so a
# failure fails the step. That is the whole basis for trusting this: a suite
# that exited 0 on failure would make the job a green light that means nothing.
name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # requirements.txt deliberately has no packer in it: the app runs from a
      # venv and packaging\build.ps1 is not the supported path, so CI installs
      # only what the app and its tests import.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Not optional. tests/test_web.py drives a real browser and fails loudly
      # when Chromium is absent rather than skipping, on the grounds that a
      # suite that quietly does nothing is worse than one that is missing.
      - name: Install Chromium for Playwright
        run: python -m playwright install chromium

      # One step per suite, so a red run names the suite that broke rather
      # than leaving it to be read out of a log.
      - name: test_parse
        run: python tests/test_parse.py

      - name: test_smoke
        run: python tests/test_smoke.py

      - name: test_changes
        run: python tests/test_changes.py

      - name: test_filters
        run: python tests/test_filters.py

      - name: test_session
        run: python tests/test_session.py

      - name: test_worker
        run: python tests/test_worker.py

      - name: test_web
        run: python tests/test_web.py
