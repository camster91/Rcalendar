  document.getElementById('modalBody').innerHTML=dayEvts.map(ev=>cardHTML(ev)).join('');
  trapFocus(document.getElementById('dayModal'));
}
document.querySelectorAll('.mover').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)closeOverlays();}));

// ── FILTER PANEL ──
// Floor, capacity, equipment and free-at need more room than the sidebar has
// left, so they live over the calendar. The panel reuses the overlay machinery
// above and the sidebar's chip classes rather than inventing a second set.
const SEAT_STEPS=[0,10,20,30,40,50,75,100,150,200];
const MINUTE_STEPS=[15,30,45,60,90,120,180];
let PRESETS=[];
// A working copy of the groups while the editor is open. Nothing reaches GROUPS
// — and so nothing reaches the sidebar — until Save groups, so an edit that is
// abandoned by closing the panel leaves the real groups untouched.
let GEDIT={};

function openFilters(){
  GEDIT=Object.fromEntries(Object.entries(GROUPS).map(([k,v])=>[k,[...v]]));
  buildFilterBody();
  trapFocus(document.getElementById('filterModal'));
  // Keyed, so reopening the panel does not refetch a set that is already for
  // the day, time and length on screen — the note is rebuilt from it instead.
  maybeRefreshFree();
  loadPresets();
}

// The floors to offer, taken from the data rather than from FLOOR_ORDER: the
// constant lists twelve floors and the bookings only ever use eleven — there is
// no 5th Floor — so a chip built from it would select nothing and read as a bug.
// ROOMS arrives sorted by (floor, room), so first-seen order is display order
// and FLOOR_ORDER does not need duplicating in the browser.
//
// NO_FLOOR stands for a room whose floor the data does not state. The floor
// filter is a *partition*, so "not on Ground Floor" is the honest reading for
// such a room — unlike capacity, which is a threshold and lenient about an
// unknown (see applyFilters). But the room used to vanish under every floor
// chip with no chip that could select it, which is a state the user could
// neither see nor enter. The sentinel is a label rather than an empty string
// because an empty string does not survive being comma-joined into a URL.
const NO_FLOOR='(no floor)';
function floorOf(room){return (ROOM_META[room]||{}).floor||NO_FLOOR;}

function floorsPresent(){
  const inData=new Set(EVENTS.map(e=>e.room));
  const out=[];
  let unknown=false;
  ROOMS.forEach(r=>{
    if(!inData.has(r))return;
    const f=(ROOM_META[r]||{}).floor;
    if(!f){unknown=true;return;}
    if(!out.includes(f))out.push(f);
  });
  // Last, so the known floors keep their display order and this reads as the
  // remainder rather than as one of them.
  if(unknown)out.push(NO_FLOOR);
  return out;
}
function roomsWithNoFloor(){
  const inData=new Set(EVENTS.map(e=>e.room));
  return ROOMS.filter(r=>inData.has(r)&&!(ROOM_META[r]||{}).floor).length;
}
function roomsWithoutCapacity(){
  const seen=new Set();
  EVENTS.forEach(e=>{
    const m=ROOM_META[e.room];
    if(m&&m.capacity==null)seen.add(e.room);
  });
  return seen.size;
}

function el(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text;
  return e;
}
function sec(title){
  const s=el('div','fsec');
  s.appendChild(el('div','stit',title));
  return s;
}
// A heading over a run of sections. The panel had seven sections at one level,
// which made a filter, a group editor and a saved-filter list read as peers --
// they are three different kinds of thing, and "Capacity" sitting beside
// "Save groups" is what made the panel feel like a settings page. The heading
// says which kind each run is.
function secGroup(title){
  return el('div','fgrp-hd-s',title);
}

function buildFilterBody(){
  const body=document.getElementById('filterBody');
  body.innerHTML='';

  // Stated, not silently ignored. A change row describes a booking that was
  // added or removed in the past, so "free at 2pm" and "seats ≥ 20" have
  // nothing to say about it. Rooms and the search box do, and only those reach
  // the feed.
  if(viewMode==='changes'){
    const cw=el('div','fnote');
    cw.textContent='The Changes view reads room and search only. Floor, capacity, '
      +'equipment and free-at describe what a room is like now, and a change row '
      +'is about the past — so they are not applied here.';
    body.appendChild(cw);
  }

  body.appendChild(secGroup('Narrow the rooms'));

  // ── Floor ──
  const fs=sec('Floor');
  const fbar=el('div','gbar');
  const floors=floorsPresent();
  if(!floors.length){fs.appendChild(el('div','fempty','No floors in the current data.'));}
  else{
    floors.forEach(f=>{
      const b=el('button',null,f===NO_FLOOR?'No floor':f);
      b.classList.toggle('on',advFloors.has(f));
      b.setAttribute('aria-pressed',advFloors.has(f)?'true':'false');
      b.onclick=()=>{if(advFloors.has(f))advFloors.delete(f);else advFloors.add(f);commitFilterChange();};
      fbar.appendChild(b);
    });
    // "Any floor" belongs in the same row as the floors, the way "All" does in
    // the sidebar's group bar — appended to the section instead it wrapped onto
    // a line of its own and read as a separate control.
    const any=el('button','gb','Any floor');
    any.classList.toggle('on',!advFloors.size);
    any.setAttribute('aria-pressed',advFloors.size?'false':'true');
    any.onclick=()=>{advFloors.clear();commitFilterChange();};
    fbar.appendChild(any);
    fs.appendChild(fbar);
    // Stated, not silent, and stated only when there is something to state.
    // The rule is the opposite of the capacity one above, so leaving it
    // unspoken would make the two look like an oversight rather than a choice.
    const nf=roomsWithNoFloor();
    if(nf)fs.appendChild(el('div','fnote',
      nf+' of '+ROOMS.length+' rooms have no recorded floor. Unlike capacity, '
      +'floor is a partition, so they are not on the floor you picked — choose '
      +'"No floor" to see them.'));
  }
  body.appendChild(fs);

  // ── Capacity ──
  const cs=sec('Capacity');
  const crow=el('div','frow');
  // htmlFor, not a bare <label> beside the control: a label only names a
  // control it is *for* or that is inside it, and these are siblings in a flex
  // row, so as written it named nothing and the select announced itself as just
  // "combo box". The visible text is the name, which is also what a voice
  // control says when you read it aloud.
  const seatLbl=el('label',null,'Seats ≥');seatLbl.htmlFor='seatSel';
  crow.appendChild(seatLbl);
  const sel=el('select');sel.id='seatSel';
  SEAT_STEPS.forEach(n=>{
    const o=el('option',null,n?'at least '+n:'any size');
    o.value=String(n);o.selected=(n===advSeats);sel.appendChild(o);
  });
  sel.onchange=()=>{advSeats=+sel.value;commitFilterChange();};
  crow.appendChild(sel);
  cs.appendChild(crow);
  // Stated, not silent. Almost half the rooms have no recorded capacity, and the
  // rule is that they pass the minimum rather than being hidden by it.
  cs.appendChild(el('div','fnote',
    roomsWithoutCapacity()+' of '+ROOMS.length+' rooms have no recorded capacity. '
    +'They are kept by a minimum rather than hidden — a room that might be too '
    +'small is a better answer than half the building disappearing.'));
  body.appendChild(cs);

  // ── Equipment ──
  const es=sec('Equipment');
  const ebar=el('div','gbar');
  const pb=el('button',null,'🎥 Panopto');
  pb.classList.toggle('on',advPanopto);
  pb.setAttribute('aria-pressed',advPanopto?'true':'false');
  pb.onclick=()=>{advPanopto=!advPanopto;commitFilterChange();};
  ebar.appendChild(pb);
  es.appendChild(ebar);
  body.appendChild(es);

  body.appendChild(secGroup('Find a slot'));

  // ── Free at a time ──
  const tms=sec('Free at a time');
  const trow=el('div','frow');
  const fromLbl=el('label',null,'Free from');fromLbl.htmlFor='freeFrom';
  trow.appendChild(fromLbl);
  const time=el('input');time.type='time';time.value=advFreeAt;time.id='freeFrom';
  time.onchange=()=>{advFreeAt=time.value;FREE_KEY='';commitFilterChange({refetchFree:true});};
  trow.appendChild(time);
  // "for" is the connective in "free from 14:00 for 60 min", not a label for
  // this control, so it stays decorative and the select is named for what it
  // chooses instead.
  trow.appendChild(el('label',null,'for'));
  const mins=el('select');
  mins.setAttribute('aria-label','For how long');
  MINUTE_STEPS.forEach(n=>{const o=el('option',null,n+' min');o.value=String(n);o.selected=(n===advFreeMins);mins.appendChild(o);});
  mins.onchange=()=>{advFreeMins=+mins.value;FREE_KEY='';commitFilterChange({refetchFree:true});};
  trow.appendChild(mins);
  if(advFreeAt){
    const off=el('button',null,'Turn off');off.className='gb';
    off.onclick=()=>{advFreeAt='';FREE_DAYS=null;FREE_KEY='';commitFilterChange();};
    trow.appendChild(off);
  }
  tms.appendChild(trow);
  const fnote=el('div','fnote','');
  fnote.id='freeNote';
  fnote.textContent=freeNoteText();
  tms.appendChild(fnote);
  body.appendChild(tms);

  body.appendChild(secGroup('Manage'));

  // ── Groups ──
  const gs=sec('Groups');
  Object.keys(GEDIT).forEach(name=>gs.appendChild(groupEditorRow(name)));
  const addb=el('button',null,'+ Add group');
  addb.className='btn';
  addb.onclick=()=>{
    let n='New group',i=2;
    while(GEDIT[n])n='New group '+(i++);
    GEDIT[n]=[];
    buildFilterBody();
  };
  gs.appendChild(addb);
  const saveb=el('button',null,'Save groups');
  saveb.className='btn btn-a';saveb.style.marginLeft='8px';
  saveb.onclick=saveGroups;
  gs.appendChild(saveb);
  gs.appendChild(el('div','fnote',
    'Saved to data/room_groups.json and shared by both views. Clearing every '
    +'room from a group keeps the group but selects nothing.'));
  body.appendChild(gs);

  body.appendChild(secGroup('Saved'));

  // ── Presets ──
  const ps=sec('Saved filters');
  const ptags=el('div','ftags');ptags.id='presetTags';
  ps.appendChild(ptags);
  const prow=el('div','frow');
  const pname=el('input');pname.type='text';pname.placeholder='Name this filter…';pname.id='presetName';
  // The placeholder is not a name: it is gone the moment anything is typed,
  // and it was the only thing this box had. Named for what it does instead.
  pname.setAttribute('aria-label','Name this filter');
  prow.appendChild(pname);
  const psave=el('button',null,'Save');psave.className='btn';
  psave.onclick=()=>savePreset(pname.value);
  prow.appendChild(psave);
  ps.appendChild(prow);
  ps.appendChild(el('div','fnote',
    'A preset holds the filters only — not the day or the view, which would make '
    +'it useless tomorrow. The link below is the opposite: it does carry the date.'));
  body.appendChild(ps);
  renderPresets();

  body.appendChild(secGroup('Actions'));

  // ── Actions ──
  const acts=el('div','facts');
  const copy=el('button',null,'🔗 Copy link');copy.className='btn';
  copy.onclick=()=>copyLink();
  const clear=el('button',null,'Clear all');clear.className='btn';
  clear.onclick=clearAllFilters;
  acts.append(copy,clear);
  body.appendChild(acts);
}

// One group: a name, its rooms, and a delete.
function groupEditorRow(name){
  const row=el('div','fgrp');
  const hd=el('div','fgrp-hd');
  const inp=el('input');inp.type='text';inp.value=name;
  inp.setAttribute('aria-label','Group name');
  // Committed on blur, not on every keystroke. The live version wrote straight
  // into the working copy on each input, and it could not tell a finished name
  // from a half-typed one. Names are the object's keys, so renaming onto a name
  // that already exists does not create a duplicate — it assigns over the other
  // group and destroys its rooms, silently, which is what typing "Study Rooms"
  // did whenever a group called "Study" was already there: the write happened
  // the moment the field read "Study". Refusing the collision instead does not
  // work either, because the field then can never be typed past "Stud" — the
  // name is committed before it is finished either way. On blur it is finished,
  // so a collision can be named and the box put back to the name the group
  // actually has.
  const commit=()=>{
    const v=inp.value.trim();
    if(v===name)return;
    if(!v){toast('⚠️ A group needs a name');inp.value=name;return;}
    // The comma is the shared-link vocabulary's join *and* its split: every
    // writer comma-joins group names into groups=, and parseFilters splits
    // on the same character, so a name with one drops out of the link on
    // read-back as though the filter never existed. Refused here because the
    // server has to reject the whole map, and one bad name should not cost
    // the user every other group's edits.
    if(v.includes(',')){toast('⚠️ Commas are not allowed in a group name');inp.value=name;return;}
    if(GEDIT[v]){toast('⚠️ A group called “'+v+'” already exists');inp.value=name;return;}
    GEDIT[v]=GEDIT[name];delete GEDIT[name];name=v;
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}};
  hd.appendChild(inp);
  const del=el('button','fdel','Delete');
  del.onclick=()=>{delete GEDIT[name];buildFilterBody();};
  hd.appendChild(del);
  row.appendChild(hd);

  const rooms=el('div','fgrp-rooms');
  ROOMS.forEach(r=>{
    const c=el('div','rc');
    // The editor's chips show group membership. They carry .rc for the look,
    // but syncChips is scoped to #rchips so it cannot repaint them.
    c.textContent=r;
    const on=(GEDIT[name]||[]).includes(r);
    c.classList.toggle('on',on);c.classList.toggle('off',!on);
    c.setAttribute('role','button');c.tabIndex=0;
    c.setAttribute('aria-pressed',on?'true':'false');
    c.onclick=()=>{
      const list=GEDIT[name]||(GEDIT[name]=[]);
      const i=list.indexOf(r);
      if(i<0)list.push(r);else list.splice(i,1);
      const now=list.includes(r);
      c.classList.toggle('on',now);c.classList.toggle('off',!now);
      c.setAttribute('aria-pressed',now?'true':'false');
    };
    rooms.appendChild(c);
  });
  row.appendChild(rooms);
  return row;
}

async function saveGroups(){
  const clean={};
  Object.entries(GEDIT).forEach(([k,v])=>{if(k.trim())clean[k.trim()]=v;});
  if(!Object.keys(clean).length){toast('⚠️ Every group needs a name');return;}
  try{
    const r=await fetch('/api/room-groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(clean)});
    const d=await r.json();
    if(!r.ok){toast('⚠️ '+(d.error||'Could not save groups'));return;}
    const before=GROUPS;
    GROUPS=clean;
    // An active group whose rooms just changed (or that was just deleted)
    // leaves the calendar filtered by what it *used* to hold, since a group
    // is expanded into activeRooms when it is selected. Re-expand — but only
    // then, so saving an unrelated group cannot undo a room selection the
    // user refined by hand.
    const touched=[...activeGroups].some(
      g=>JSON.stringify(before[g])!==JSON.stringify(GROUPS[g]));
    activeGroups=new Set([...activeGroups].filter(g=>GROUPS[g]));
    if(touched)activeRooms=activeGroups.size?roomsForGroups():new Set(ROOMS);
    buildGroupBtns();buildChips();commitFilterChange();
    toast('Groups saved',true);
  }catch(e){toast('⚠️ '+e.message);}
}

// ── FREE AT A TIME (server-side) ──
// Asked of /api/today, the same route and the same predicate that answer Free
// Right Now. A JS reimplementation would be a second answer to one question.
let FREE_KEY='';
// The days the current view draws bookings from. A month cell is a whole grid,
// so the first and last cells can fall in the neighbouring month — asking for
// the grid is simpler than trimming it, and 42 days is well inside the
// server's cap of 62.
function viewDays(){
  if(viewMode==='changes')return [];
  if(viewMode==='month'){
    const y=curDate.getFullYear(),m=curDate.getMonth();
    const first=new Date(y,m,1),last=new Date(y,m+1,0);
    const total=Math.ceil((first.getDay()+last.getDate())/7)*7;
    const start=new Date(y,m,1-first.getDay()),out=[];
    for(let i=0;i<total;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);out.push(fmtISO(d));
    }
    return out;
  }
  if(viewMode==='week'){
    const sow=new Date(curDate);sow.setDate(curDate.getDate()-curDate.getDay());
    const out=[];
    for(let i=0;i<7;i++){
      const d=new Date(sow);d.setDate(sow.getDate()+i);out.push(fmtISO(d));
    }
    return out;
  }
  return [fmtISO(curDate)];
}
// The key is what the held set is an answer to, and it names the whole span on
// screen — not one day. The note is rebuilt from it whenever the panel is
// redrawn, so reopening the panel does not refetch a set that is already
// current.
function freeKey(){
  const d=viewDays();
  return d.length?d[0]+'|'+d[d.length-1]+'|'+advFreeAt+'|'+advFreeMins:'';
}
// Which day a booking belongs to, for looking it up in the per-day answer.
// The server buckets on the row's own `date` (falling back to the start
// timestamp, the same way avail._span derives it), so this has to agree with
// that or the client would look up a day the server never answered about.
function dayKey(e){return e.date||(e.start||'').slice(0,10);}
function freeOn(e){
  const set=FREE_DAYS&&FREE_DAYS.get(dayKey(e));
  return !!(set&&set.has(e.room));
}
function freeNoteText(){
  if(!advFreeAt)return 'Off. Checked against the day on screen, not today.';
  if(!FREE_DAYS||FREE_KEY!==freeKey())return 'checking…';
  const days=viewDays();
  if(days.length<=1){
    const set=FREE_DAYS.get(days[0])||new Set();
    return set.size+' of '+ROOMS.length+' rooms free from '
      +advFreeAt+' for '+advFreeMins+' min on '+days[0];
  }
  // Across a span, the honest single number is the rooms free on *every* day
  // of it. The old note reported one day's count, which was true of that day
  // and false of the rest of the month it was being applied to.
  let every=null;
  days.forEach(d=>{
    const set=FREE_DAYS.get(d)||new Set();
    every=every===null?new Set(set):new Set([...every].filter(r=>set.has(r)));
  });
  return (every?every.size:0)+' of '+ROOMS.length+' rooms free from '+advFreeAt
    +' for '+advFreeMins+' min on every day shown — each booking is checked'
    +' against its own day';
}
// Looked up on every write, not captured once. The panel body is rebuilt
// whenever it opens, so #freeNote is a different element before and after —
// and a request that starts with the panel closed (a shared link carrying
// ?free=) would otherwise write its answer into a detached node and leave the
// panel showing "checking…" for good.
function setFreeNote(text){
  const note=document.getElementById('freeNote');
  if(note)note.textContent=text;
}
function maybeRefreshFree(){
  if(!advFreeAt)return;
  // The change feed is not a span of time, so there is no day to ask about.
  // Cleared rather than left holding the last answer, which would be an answer
  // to a question this view never asked.
  if(!viewDays().length){FREE_DAYS=null;FREE_KEY='';return;}
  const key=freeKey();
  if(key===FREE_KEY)return;
  FREE_KEY=key;
  loadFreeRooms();
}
async function loadFreeRooms(){
  if(!advFreeAt){FREE_DAYS=null;applyFilters();return;}
  const days=viewDays();
  if(!days.length){FREE_DAYS=null;applyFilters();return;}
  setFreeNote('checking…');
  try{
    // One request for the whole span. Asking per visible day would work and
    // would be 42 round trips, each a full read of the events table.
    const d=await (await fetch('/api/today?dates='+days.join(',')
      +'&at='+encodeURIComponent(advFreeAt)+'&for='+advFreeMins)).json();
    const m=new Map();
    Object.keys(d.days||{}).forEach(k=>m.set(k,new Set((d.days[k].free||[]))));
    FREE_DAYS=m;
    setFreeNote(freeNoteText());
  }catch(e){
    // Left as no-opinion rather than empty: a failed request must not read as
    // "no room is free". FREE_KEY deliberately keeps the key it was set to —
    // clearing it here would make the render() this call ends with see a
    // changed key, refetch immediately, fail again, and spin. A failed check
    // is retried when the day, time or length changes, not on every paint.
    FREE_DAYS=null;
    setFreeNote('Could not check availability: '+e.message);
  }
  applyFilters();
}

// ── PRESETS ──
function currentFilters(){
  return {rooms:[...activeRooms],groups:[...activeGroups],q:searchQ,
          floors:[...advFloors],seats:advSeats,panopto:advPanopto,
          free:advFreeAt,mins:advFreeMins};
}
async function loadPresets(){
  try{const d=await (await fetch('/api/presets')).json();PRESETS=d.presets||[];}
  catch(e){PRESETS=[];}
  renderPresets();
}
function renderPresets(){
  const box=document.getElementById('presetTags');
  if(!box)return;
  box.innerHTML='';
  if(!PRESETS.length){box.appendChild(el('div','fempty','No saved filters yet.'));return;}
  PRESETS.forEach(p=>{
    // Two real buttons, not one span with an onclick and a ✕ riding a
    // stopPropagation inside it: applying a preset and deleting one are
    // separate acts, and each deserves its own focusable, activatable
    // element — a span puts both outside the keyboard and outside every
    // "what here can I act on" question a reader asks of the row.
    const t=el('span','tag');
    const b=el('button','tag-btn',p.name);b.type='button';
    b.title='Apply “'+p.name+'”';
    b.onclick=()=>applyPreset(p);
    const x=el('button','tag-x','✕');x.type='button';
    x.title='Delete “'+p.name+'”';
    x.onclick=()=>deletePreset(p.name);
    t.appendChild(b);t.appendChild(x);
    box.appendChild(t);
  });
}
// Takes the whole preset rather than its filters object: the toast below used
// to read f.name off the filters, which have no name, so every application
// announced Applied "undefined".
function applyPreset(p){
  const f=parseFilters((p&&p.filters)||{},{rooms:ROOMS,groups:GROUPS});
  activeGroups=new Set(f.groups||[]);
  // No room list means the group selection implies its rooms — the same
  // inference readURL makes, through the same helper. Without it, a preset
  // naming a group and no rooms lit the group over every room, a state the
  // page's own writer cannot express: writeURL drops rooms= when every room
  // is on but still writes groups=, so the link said "North alone" while the
  // screen showed the building, and it narrowed on reload. With neither
  // named, every room — an empty set here is what blanked the calendar for
  // a preset that simply had not recorded any rooms.
  activeRooms=f.rooms?new Set(f.rooms):(activeGroups.size?roomsForGroups():new Set(ROOMS));
  searchQ=f.q;
  document.getElementById('q').value=f.q;
  advFloors=new Set(f.floors||[]);
  advSeats=f.seats;
  advPanopto=f.panopto;
  advFreeAt=f.free;
  advFreeMins=f.mins;
  // Clearing the key alone would leave the previous set in place and apply it
  // to the new filters for as long as the refetch took.
  FREE_KEY='';FREE_DAYS=null;
  // No chip clearing here any more: the Active row is derived from the state
  // set above, so it was never holding the previous filter's chips to clear.
  commitFilterChange();
  toast('Applied “'+((p&&p.name)||'filter')+'”',true);
}
async function savePreset(rawName){
  const name=(rawName||'').trim();
  if(!name){toast('⚠️ Name the preset first');return;}
  if(name.length>60){toast('⚠️ Name is too long');return;}
  try{
    const r=await fetch('/api/presets',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,filters:currentFilters()})});
    const d=await r.json();
    if(!r.ok){toast('⚠️ '+(d.error||'Could not save'));return;}
    PRESETS=d.presets||[];renderPresets();
    const inp=document.getElementById('presetName');if(inp)inp.value='';
    toast('Saved “'+name+'”',true);
  }catch(e){toast('⚠️ '+e.message);}
}
async function deletePreset(name){
  try{
    const d=await (await fetch('/api/presets?name='+encodeURIComponent(name),{method:'DELETE'})).json();
    PRESETS=d.presets||[];renderPresets();
  }catch(e){toast('⚠️ '+e.message);}
}

function clearAllFilters(){
  activeRooms=new Set(ROOMS);
  activeGroups.clear();
  searchQ='';document.getElementById('q').value='';
  advFloors.clear();advSeats=0;advPanopto=false;advFreeAt='';advFreeMins=60;
  FREE_DAYS=null;FREE_KEY='';
  commitFilterChange();
  toast('Filters cleared',true);
}

function copyLink(){
  const url=location.href;
  navigator.clipboard.writeText(url).then(()=>toast('Link copied',true))
    .catch(()=>toast('⚠️ Could not copy — '+url));
}

// ── URL STATE ──
// replaceState, not pushState: with push, every chip click becomes a
// back-button step and leaving the page takes a dozen presses. The cost is that
// Back does not undo a filter — Clear all is the escape hatch for that.
// The coercion rules both readers share live in parseFilters, in /filters.js.

function writeURL(){
  const p=new URLSearchParams();
  // The rooms/q/from/to vocabulary is the one both pages' URL params share,
  // so a copied link means the same thing wherever it lands.
  if(activeRooms.size&&activeRooms.size<ROOMS.length)p.set('rooms',[...activeRooms].join(','));
  if(searchQ)p.set('q',searchQ);
  if(activeGroups.size)p.set('groups',[...activeGroups].join(','));
  if(advFloors.size)p.set('floors',[...advFloors].join(','));
  if(advSeats)p.set('seats',advSeats);
  if(advPanopto)p.set('panopto','1');
  if(advFreeAt){p.set('free',advFreeAt);p.set('mins',advFreeMins);}
  p.set('view',viewMode);
  p.set('date',fmtISO(curDate));
  const qs=p.toString();
  history.replaceState(null,'',qs?'?'+qs:location.pathname);
}
// Read once at the end of boot(), after activeRooms and the Classroom union
// have been set up and before the first applyFilters().
function readURL(){
  const p=new URLSearchParams(location.search);
  const f=parseFilters(Object.fromEntries(p),{rooms:ROOMS,groups:GROUPS});
  if(f.groups)activeGroups=new Set(f.groups);
  // An explicit room list is the more specific statement, so it wins; with only
  // groups named, the selection implies its rooms — the same inference
  // toggleGroup makes, through the same helper.
  if(f.rooms)activeRooms=new Set(f.rooms);
  else if(activeGroups.size)activeRooms=roomsForGroups();
  if(f.q){searchQ=f.q;document.getElementById('q').value=f.q;}
  if(f.floors)advFloors=new Set(f.floors);
  advSeats=f.seats;
  advPanopto=f.panopto;
  advFreeAt=f.free;
  advFreeMins=f.mins;
  const v=p.get('view');
  if(v&&['today','week','month','changes'].includes(v))viewMode=v;
  const d=p.get('date');
  // Noon, so the local-date round-trip through fmtISO cannot slip a day — the
  // same reason fmtDay appends T12:00:00.
  if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d))curDate=new Date(d+'T12:00:00');
  document.querySelectorAll('button.vtab').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');});
  const tab=document.getElementById('v-'+viewMode);
  if(tab){tab.classList.add('on');tab.setAttribute('aria-pressed','true');}
  // Synced, not rendered: boot renders once, after this.
  syncFilterControls();
  return p.toString().length>0;
}

// ── TOOLTIP — stays open while hovering/selecting ──
function showTip(e,el){
  let title,start,end,rooms,desc;
  if(el&&el.dataset){title=el.dataset.title;start=el.dataset.start;end=el.dataset.end;rooms=el.dataset.rooms?el.dataset.rooms.split(','):[];desc=el.dataset.desc;}
  else if(el&&el.title){title=el.title;start=el.start;end=el.end;rooms=[el.room];desc=el.description;}else return;
  const tip=document.getElementById('tip');
  document.getElementById('tipT').textContent=title||'';
  let ts=fmtDay(start)+', '+fmtT(start);if(end)ts+=' → '+fmtT(end);
  document.getElementById('tipD').textContent=ts;
  document.getElementById('tipR').textContent=rooms.length>1?'Rooms '+rooms.join(', '):'Room '+(rooms[0]||'?');
  document.getElementById('tipDe').textContent=desc||'';
  tip.style.display='block';tip.style.left=Math.min(e.clientX+12,window.innerWidth-360)+'px';tip.style.top=Math.min(e.clientY+12,window.innerHeight-180)+'px';
}
// Only close tooltip on mousedown outside the tooltip
document.addEventListener('mousedown',e=>{const tip=document.getElementById('tip');if(tip.style.display==='block'&&!tip.contains(e.target))tip.style.display='none';});
// The keyboard's half of the tip: Enter or Space on a focusable strip item
// (.wkad, via tipAttrs' dataset) opens the same box the click does, anchored
// at the item's corner for the same reason the week bars anchor theirs.
// Escape closes it — a click anywhere already could, and a keyboard that
// opened the box needs a way to put it back.
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const tip=document.getElementById('tip');if(tip.style.display==='block')tip.style.display='none';return;}
  if(e.key!=='Enter'&&e.key!==' ')return;
  const t=e.target;
  if(t.classList&&t.classList.contains('wkad')){
    e.preventDefault();
    const r=t.getBoundingClientRect();
    showTip({clientX:r.left,clientY:r.bottom},t);
  }
});

// ── SCRAPE ──
async function triggerScrape(){
  // By id, not by class: the scrape button used to be found with
  // querySelector('.btn-a'), which silently grabs whichever accent button
  // happens to come first in the document.
  const btn=document.getElementById('scrapeBtn');
  if(btn.disabled)return;
  btn.textContent='⏳';btn.disabled=true;
  try{
    const r=await fetch('/api/scrape',{method:'POST'});
    const d=await r.json();
    if(r.status===409){toast('⚠️ '+(d.message||'Already running'));btn.textContent='⟳';btn.disabled=false;return;}
    // The worker scrapes on its own thread; poll until it reports done. As in
    // doLogin(), a false `busy` before the worker has picked the job up is not
    // the same as a finished job.
    const t0=Date.now();
    let sawBusy=false;
    while(Date.now()-t0<15*60*1000){
      await new Promise(s=>setTimeout(s,2000));
      const st=await (await fetch('/api/status')).json();
      if(st.busy){sawBusy=true;continue;}
      if(!sawBusy)continue;
      if(st.session==='expired'){toast('❌ Session expired — use “Sign in to LSM”');}
      else if(st.last_scrape_status==='error'){toast('❌ '+st.last_scrape_message);}
      else{toast('✅ '+(st.last_scrape_message||'Scraped'),true);setTimeout(()=>location.reload(),900);}
      btn.textContent='⟳';btn.disabled=false;return;
    }
    toast('⚠️ Still running — see the sidebar');btn.textContent='⟳';btn.disabled=false;
  }catch(e){toast('❌ '+e.message);btn.textContent='⟳';btn.disabled=false;}
}

function toast(msg,ok){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';if(ok)t.classList.add('ok');setTimeout(()=>{t.style.display='none';t.classList.remove('ok');},ok?2000:3000);}

// ── UPDATES ──
// One rendering from one source: loadStatus hands every /api/status read to
// renderUpdate, so the sidebar line and the toolbar offer can never disagree
// — they are two views of the same dict, drawn by the same call. Nothing in
// this section fetches on its own except the action handlers, which POST
// and then let the poll (fast while busy, via adaptPoll) bring the answer.
function renderUpdate(d){
  const u=d.update||{},st=u.state||'idle';
  const info=document.getElementById('updInfo'),btn=document.getElementById('updBtn'),
        ban=document.getElementById('updBanner'),skip=document.getElementById('updSkip'),
        chk=document.getElementById('updCheck'),tog=document.getElementById('updTokenTog');
  let line='<strong>v'+esc(u.current_version||'?')+'</strong>';
  if(u.last_check)line+='<br>checked '+new Date(u.last_check)
    .toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  // The amber offer — and the only state that shows the Install controls.
  // "Available" and "ready" are the same offer at two ages: the check that
  // finds a release pre-downloads and verifies it, so "ready" is that offer
  // with the wait already paid. Everything else is a report: downloading
  // shows progress, failed shows its one honest sentence (with the token
  // row below as the fix it names), installing tells the reader why the
  // page is about to die.
  const offer=st==='available'||st==='ready';
  if(offer){
    line+='<br><strong style="color:var(--og)">'+esc(u.latest_version||'')+' available</strong>';
    if(st==='ready')line+='<br>Downloaded and verified — Install runs it.';
    else if(u.message)line+='<br>'+esc(u.message);
  }
  else if(st==='checking')line+='<br>Checking for updates…';
  else if(st==='downloading')line+='<br>Downloading '+esc(u.progress||'…');
  else if(st==='installing')line+='<br>Installer running — the app will close now.';
  else if(st==='failed')line+='<br><span style="color:#dc2626">'+esc(u.message||'The check could not be made.')+'</span>';
  else if(st==='latest')line+='<br>'+esc(u.message||'Up to date');
  info.innerHTML=line;
  ban.style.display=offer?'inline-flex':'none';
  if(offer)ban.textContent='⬆ Update available — '+(u.latest_version||'');
  // The button's busy state belongs to doInstallUpdate, which owns the
  // click; this function owns the visibility, which is a fact about the
  // release rather than about the click. A failed install's sentence says
  // "Try again", so when an offer is still standing the button is the
  // thing to try again *with* — hidden, the sentence would be an
  // instruction with no act. Only when something was genuinely offered:
  // a failed *check* that never saw a release has nothing to retry.
  const cur='v'+(u.current_version||'?');
  const retry=st==='failed'&&u.latest_version&&u.latest_version!==cur;
  btn.style.display=(offer||retry)?'block':'none';
  // The label only when the click does not own the button: mid-install it
  // is disabled and doInstallUpdate has set its own working label, and a
  // poll rewriting that mid-download would flash "Install update" over
  // the progress the reader is watching.
  if(!btn.disabled)btn.textContent=retry&&!offer?'Try again':'Install update';
  skip.style.display=offer?'block':'none';
  chk.style.display='block';tog.style.display='block';
  // The token row is the fix a failed check names, so it must also admit
  // whether it is already fixed — a person with a saved token who reads
  // "paste a token" needs to know the app is already holding one.
  tog.textContent=u.token_set?'GitHub token — saved, replace it…':'GitHub token…';
  // And its Clear button must not offer to remove what is not there.
  document.getElementById('ghClear').style.display=u.token_set?'':'none';
}

function doCheckUpdate(){
  toast('Checking for updates…',true);
  fetch('/api/update/check',{method:'POST'})
    .then(r=>r.json()).then(d=>{
      if(d.status==='busy')toast('⚠️ '+(d.message||'Something else is running'));
    })
    .catch(e=>toast('❌ '+e.message));
}

async function doInstallUpdate(){
  const btn=document.getElementById('updBtn');
  if(btn.disabled)return;
  // The wait the label promises is the wait the click actually faces: a
  // pre-staged (ready) offer already holds verified bytes, so the click
  // starts the installer; anything else downloads first.
  btn.disabled=true;
  btn.textContent=(STATUS&&STATUS.update&&STATUS.update.state==='ready')
    ?'⬆ Starting the installer…':'⏳ Downloading…';
  // Once the installer is running, a refused fetch is the teardown arriving,
  // not a failed update — the poll loop below treats it as silence instead
  // of an error for exactly that reason.
  let sawInstalling=false;
  try{
    const r=await fetch('/api/update/install',{method:'POST'});
    const d=await r.json();
    if(r.status===409){toast('⚠️ '+(d.message||'Something else is running'));btn.disabled=false;return;}
    // POST-then-poll, like the scrape button: the reply means "started",
    // and /api/status is the one that knows the outcome. Terminal states
    // are installing (success — the process exits) and failed; everything
    // else is the worker still holding the job.
    const t0=Date.now();let sawBusy=false;
    while(Date.now()-t0<20*60*1000){
      await new Promise(s=>setTimeout(s,2000));
      let st;
      try{st=await (await fetch('/api/status')).json();}
      catch(e){if(sawInstalling)return;throw e;}
      renderUpdate(st);
      const u=st.update||{};
      if(u.state==='installing'){sawInstalling=true;toast('✅ Installer running — closing…',true);return;}
      if(u.state==='failed'){toast('❌ '+(u.message||'The update failed'));return;}
      if(st.busy){sawBusy=true;continue;}
      if(!sawBusy)continue;
      toast('⚠️ Update did not finish — see the sidebar');
      return;
    }
    toast('⚠️ Still working — see the sidebar');
  }catch(e){
    if(!sawInstalling)toast('❌ '+e.message);
  }finally{
    btn.disabled=false;
    // Not a hard-coded label: the poll that would relabel this button can
    // be a minute away, and the state it must speak for is already in
    // hand — STATUS is the last /api/status reading, the same dict
    // renderUpdate speaks from.
    renderUpdate(STATUS||{});
  }
}

function doSaveToken(){
  const inp=document.getElementById('ghToken');
  // Trimmed once, not silently cleaned: whitespace *inside* the token is a
  // paste accident the server refuses by name rather than a token to save.
  const t=inp.value.trim();
  fetch('/api/update/token',{method:'POST',headers:{'Content-Type':'application/json'},
                              body:JSON.stringify({token:t})})
    .then(r=>r.json()).then(d=>{
      if(d.status==='ok'){
        toast('Token saved',true);inp.value='';loadStatus();
        // A saved token is what a failed check told the reader to go get,
        // so the check runs again by itself: making them find the Check
        // link and press it would be handing them the last step of the
        // errand they just finished. A busy worker's 409 is toasted by
        // doCheckUpdate like any other click.
        doCheckUpdate();
      }
      else toast('⚠️ '+(d.message||'The token was not saved'));
    })
    .catch(e=>toast('❌ '+e.message));
}

function doClearToken(){
  fetch('/api/update/token',{method:'DELETE'})
    .then(r=>r.json()).then(d=>{
      if(d.status==='ok'){toast('Token cleared',true);loadStatus();}
    })
    .catch(e=>toast('❌ '+e.message));
}

// ── KEYBOARD ──
// One delegate gives every [role="button"] Enter and Space. Without it the
// month cells, room chips and free-room pills are clickable but unreachable.
// Modifiers are forwarded rather than dropped: room chips treat Ctrl+Enter
// as a Ctrl-click, so the accumulate path is not mouse-only.
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const t=e.target&&e.target.closest?e.target.closest('[role="button"]'):null;
  if(!t)return;
  e.preventDefault();
  if(e.ctrlKey||e.metaKey||e.shiftKey)
    t.dispatchEvent(new MouseEvent('click',{ctrlKey:e.ctrlKey,metaKey:e.metaKey,shiftKey:e.shiftKey,bubbles:true}));
  else t.click();
});
document.addEventListener('keydown',e=>{
  const a=document.activeElement;
  const typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);
  // The view-switch letters are suppressed while an interactive element has
  // focus, otherwise tabbing to a room chip and pressing "d" would silently
  // switch the view out from under the user. Escape is the only key that works
  // from everywhere: the arrows and "/" sit below the typing check on purpose,
  // because an arrow key belongs to the text cursor while you are in a field.
  const onControl=a&&(a.tagName==='BUTTON'||a.tagName==='A'||(a.getAttribute&&a.getAttribute('role')==='button'));
  if(e.key==='Escape'){closeModal();toggleFreePanel(false);return;}
  if(typing)return;
  if(e.key==='/'){e.preventDefault();document.getElementById('q').focus();return;}
  if(e.key==='ArrowLeft'){nav(-1);return;}
  if(e.key==='ArrowRight'){nav(1);return;}
  if(onControl)return;
  if(e.key==='t'){goToday();e.preventDefault();}
  if(e.key==='m')setView('month');
  if(e.key==='w')setView('week');
  if(e.key==='d')setView('today');
  if(e.key==='c')setView('changes');
});

// ── BOOT ──
async function loadStatus(){
  let d;
  try{
    const r=await fetch('/api/status');d=await r.json();
  }catch(e){
    // The fetch itself died, so the last good reading is now a stale claim,
    // and "Session active" is the worst of those to leave standing. Back to
    // unknown — the same retraction list.html's badge makes. Only the
    // session line is touched, deliberately: a failure later in this body
    // is a drawing fault, and a session that *was* read is a fact even
    // when a later line fails to render it.
    const el=document.getElementById('sessInfo');
    el.className='sess warn';el.textContent='● Session unknown — could not reach the app';
    document.getElementById('loginBtn').style.display='block';
    document.getElementById('logoutLink').style.display='none';
    return;
  }
  try{
    // The card and the fast poll both speak from this reading, and the BF
    // edge below can return early, so both are handled here at the top
    // rather than at the end.
    STATUS=d;adaptPoll();
    const el=document.getElementById('sessInfo'),btn=document.getElementById('loginBtn'),
          out=document.getElementById('logoutLink');
    // One session, two mutually exclusive controls: you can sign out of the
    // session you have, and sign in to one you do not. Offering both at once
    // would put an action on screen that cannot do anything.
    if(d.session==='ok'){el.className='sess ok';el.textContent='● Session active';btn.style.display='none';out.style.display='block';}
    else if(d.session==='expired'){el.className='sess bad';el.textContent='● Session expired';btn.style.display='block';out.style.display='none';}
    // Signed in to UofT but refused by LSM: signing out is how a person who
    // used the wrong UTORid tries another, so that control stays offered.
    else if(d.session==='no_access'){el.className='sess bad';el.textContent='● No access to LSM\'s report';el.title=d.session_message||'';btn.style.display='block';out.style.display='block';}
    else{el.className='sess warn';el.textContent='● '+(d.session_message||'Session unknown');btn.style.display='block';out.style.display='none';}

    // What the last scrape did, not what is held: the two used to share a line
    // and once the range spans a backfilled year it read as though the morning
    // scrape had fetched a year.
    document.getElementById('scrapeInfo').innerHTML=
      '<strong>'+(d.last_scrape_human||'never')+'</strong>'
      +(d.last_scrape_message?'<br>'+esc(d.last_scrape_message):'');

    // What is kept, and how far back it reaches. The history fill is the app's
    // own job now, so there is nothing to offer here — only to report. While it
    // is still owed, say so rather than showing a partial range as if it were
    // the final answer; the progress text is the only sign the app is working
    // on it, since there is no longer a button to have pressed.
    const bf=d.backfill||{};
    let tail;
    if(bf.running)      tail=esc(d.progress||'Filling history…');
    else if(d.backfill_done){
      // A run can finish ok having stepped over a month that came back empty.
      // "Filled" alone would hide that, and an unfilled month is invisible in
      // the calendar itself — it just reads as a quiet month.
      const lb=d.last_backfill||{};
      tail='Filled '+esc(lb.when||'')+(lb.note?' — '+esc(lb.note):'');
    }
    else {
      // Pending, and *why*. A fill still owed has two shapes now: one that has
      // not run yet, and one that ran but could only read page one of every
      // month because the report would not download. The second is the one a
      // person would never otherwise hear about — the months hold real
      // bookings, so they read as quiet ones, and the fill comes back at every
      // launch with nothing on screen to say what it is asking for again.
      const lb=d.last_backfill||{};
      tail='History fill pending'+(lb.note?' — '+esc(lb.note):'');
    }
    document.getElementById('histInfo').innerHTML=
      '<strong>'+(d.total_events||0).toLocaleString()+' bookings</strong>'
      +(d.date_range?'<br>'+esc(d.date_range):'')
      +(tail?'<br>'+tail:'');

    // The Updates section draws from the same read — see renderUpdate for
    // why nothing in it fetches on its own.
    renderUpdate(d);

    // The card's own refresh: its progress line is the one thing that moves
    // during a first run, and loadStatus is the only thing that re-renders
    // it. Deliberately one-sided — when the store stops being empty, the
    // reload the BF edge triggers below re-boots the page with real data,
    // and a grid drawn here from this page's still-empty EVENTS would be a
    // blank calendar with no explanation, which is the thing this card
    // exists to prevent.
    if(!d.total_events&&!EVENTS.length)renderBootCard();

    // bf.running is set and cleared explicitly by the worker, so unlike the
    // racy top-level `busy` it is safe to treat as a real edge. What the edge
    // means is only that the run stopped, which is not the same as the history
    // being filled: a run also stops when a month errored, and when its reach
    // was too short to settle the fill. Claiming success there is a lie the
    // user cannot check — the months that were never fetched read as quiet
    // ones — so the claim comes from backfill_done, the same fact the sidebar
    // reports from, and anything else says what the run actually left behind.
    const wasRunning=BF_WAS_RUNNING;
    BF_WAS_RUNNING=!!bf.running;
    if(wasRunning&&!bf.running){
      if(d.backfill_done){toast('✅ History filled',true);setTimeout(()=>location.reload(),900);return;}
      const lb=d.last_backfill||{};
      toast((lb.status==='error'?'⚠️ History fill failed':'⚠️ History fill incomplete')
            +(lb.message?' — '+lb.message:''),true);
    }

    // A scrape that ran behind this window — the 06:00 refresh while the app
    // sat in the tray, or the tray's "Scrape Now" — changes the store, while
    // this page's EVENTS were fetched once at boot. Without this the grid
    // sits beside a sidebar that says "last scrape: today 06:00" and can
    // directly contradict it: the Free-now drawer is on this same
    // interval, but a booking cancelled overnight stays on the grid with no
    // staleness marker. So when the scrape timestamp moves, the events do
    // too. The first reading is adopted rather than acted on: it is, or is
    // within a breath of, the data this page booted with.
    const at=d.last_scrape;
    if(at){
      if(EVENTS_AT===null)EVENTS_AT=at;
      else if(at!==EVENTS_AT){EVENTS_AT=at;refreshEvents();}
    }
  }catch(e){}
}

async function loadFree(){
  const box=document.getElementById('freeList');
  if(!box)return;
  const as=document.getElementById('freeAs');
  try{
    const d=await (await fetch('/api/today')).json();
    const rooms=d.rooms||[];
    const allFree=rooms.filter(r=>r.status==='free');
    // The drawer's one rule: the list answers with the same filters the
    // calendar does (roomAllowed is applyFilters' room half). "Free" on its
    // own speaks for every room at once; the question that gets asked is
    // "is a classroom free", and that is a filter question.
    const free=allFree.filter(r=>roomAllowed(r.room));
    // When the answer is about, said out loud. The list is fetched at boot
    // and the heading above it says "Free right now", which after a morning
    // in a background tab is a claim about the wrong morning. /api/today
    // answers for the moment it is called, so this is the moment it was
    // called.
    const now=new Date();
    if(as)as.textContent='as of '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    // The split the list exists for: 58 rooms were free and only 9 of them were
    // free all day, so "free" on its own is not the useful word. The count in
    // the heading is the strong one, and the groups below it are the detail.
    const allDay=free.filter(r=>!r.next_at);
    const until=free.filter(r=>r.next_at);
    const n=document.getElementById('freeN');
    if(n)n.textContent=free.length?allDay.length+' free all day':'';
    // The toolbar button's count is the same number, so the button cannot
    // promise a list the drawer then narrows — or hide a filter's effect
    // while the drawer is closed.
    const bn=document.getElementById('freeBtnN');
    if(bn)bn.textContent=free.length;
    if(!free.length){
      box.innerHTML=allFree.length
        ?'<span class="freenone">No free rooms match the current filters.</span>'
        :'<span class="freenone">Every room is booked right now.</span>';
      return;
    }
    // Longest free first, inside each group: a room free until 17:00 and one
    // free until 11:15 are different offers, and sorting by room number buries
    // the difference. The all-day group needs no sort beyond the room number,
    // which is the only tie-break it has.
    allDay.sort((a,b)=>a.room.localeCompare(b.room,undefined,{numeric:true}));
    until.sort((a,b)=>String(b.next_at).localeCompare(String(a.next_at))
      ||a.room.localeCompare(b.room,undefined,{numeric:true}));
    const row=r=>{
      const m=ROOM_META[r.room]||{};
      const name=m.display||('Room '+r.room);
      const cap=m.capacity?m.capacity+' seats':'';
      const title=name+(cap?' · '+cap:'')
        +(r.next_at?' — free until '+fmtT(r.next_at):' — free all day');
      // A real button, so the list is reachable by keyboard like everything
      // else here; the room number is the report's, hence esc().
      return '<button type="button" class="fr" data-room="'+esc(r.room)+'"'
        +' title="'+esc(title)+'" aria-label="'+esc(title)+'"'
        +' onclick="freePick(this.dataset.room)">'
        +'<span class="fr-r">'+esc(r.room)+'</span>'
        +'<span class="fr-n">'+esc(name)+'</span>'
        +(cap?'<span class="fr-c">'+esc(cap)+'</span>':'')
        +(r.next_at?'<span class="fr-t">'+fmtT(r.next_at)+'</span>':'')
        +'</button>';
    };
    const group=(label,rows)=>'<div class="fgp">'+label+' ('+rows.length+')</div>'
      +rows.map(row).join('');
    let h='';
    if(allDay.length)h+=group('Free all day',allDay);
    if(until.length)h+=group('Free until',until);
    box.innerHTML=h;
  }catch(e){
    if(as)as.textContent='';
    box.innerHTML='<span class="freeload">Unavailable</span>';
  }
}

// Picking a room here filters to it and leaves you where you are. It used to
// wipe the room filter, select this one room and switch to today's view, from a
// panel the markup described as read-only — the jump in particular was a side
// effect of a click that looked like a lookup. The reload is because the pick
// changes the filter the list itself is now subject to: without it the row
// the user just chose stays on a list that has stopped being true.
function freePick(room){pickRoom(room);loadFree();}

// ── FREE-NOW DRAWER ──
// The one rule the drawer exists for: the list answers with the same filters
// the calendar does. This is the room half of a booking filter — the
// booking-text search is deliberately not part of it, because it is a
// question about bookings, and this is a question about rooms. applyFilters
// calls it for every booking too, so there is exactly one copy of the rule.
function roomAllowed(room){
  if(!activeRooms.has(room))return false;
  // Strict for floor, lenient for capacity, and the difference is deliberate:
  // a floor is a partition, so a room with no recorded floor is not on the
  // one you selected; a capacity is a threshold, so a room with no recorded
  // capacity still passes a minimum. The panel states both, and offers
  // "No floor" so the strict reading is something you can select for.
  if(advFloors.size&&!advFloors.has(floorOf(room)))return false;
  const m=ROOM_META[room]||{};
  // An unknown capacity PASSES a minimum. About half the rooms in the report
  // have no recorded capacity, and silently hiding half the building from
  // "seats >= 20" is worse than showing a room that might be too small. It
  // must be Infinity, not 0 — 0 would hide every one of them. The panel
  // states the count for the rooms on screen; a figure written here would
  // only go stale, as the "49 of the 91" this comment used to carry did.
  if(advSeats&&(m.capacity??Infinity)<advSeats)return false;
  if(advPanopto&&!m.panopto)return false;
  return true;
}

// open/close. force is what the ✕ and Escape paths pass; the toolbar button
// passes nothing and toggles. Chips are rebuilt on every open rather than
// kept alive in the DOM, for the same reason the ⚙ panel's body is: a state
// change that happened elsewhere in the app (a preset, a URL, the panel)
// must not leave the drawer showing the filters as they were.
function toggleFreePanel(force){
  const d=document.getElementById('freeDrawer');
  const open=force===undefined?!d.classList.contains('open'):force;
  if(open){buildQuickChips();loadFree();}
  d.classList.toggle('open',open);
  document.getElementById('freeBtn').setAttribute('aria-expanded',open?'true':'false');
}

// The two groups the quick set names: the classroom list and the event halls.
// Read out of GROUPS rather than hardcoded, so a group deleted in the editor
// loses its chip instead of filtering nothing, and one the data no longer
// names never appears as a chip that selects nothing.
function quickGroups(){return ['Classroom','Events'].filter(g=>GROUPS[g]);}

// The chips themselves. Floor chips write advFloors and group chips go through
// toggleGroup — the same state the ⚙ panel and the sidebar's group bar hold,
// so a preset, a URL and a drawer chip are one filter, not three views of it.
// That is also why the sidebar's Active filters section fills in as the chips
// are used: what the drawer does is a filter like any other, and the tags are
// where every other filter is already shown.
function buildQuickChips(){
  const fb=document.getElementById('qfloor');
  if(!fb)return;
  fb.innerHTML='';
  floorsPresent().forEach(f=>{
    const b=el('button','gb'+(advFloors.has(f)?' on':''),f===NO_FLOOR?'No floor':f);
    b.setAttribute('aria-pressed',advFloors.has(f)?'true':'false');
    b.setAttribute('aria-label','Filter by floor: '+(f===NO_FLOOR?'no floor stated':f));
    b.onclick=()=>{
      if(advFloors.has(f))advFloors.delete(f);else advFloors.add(f);
      commitFilterChange();buildQuickChips();loadFree();
    };
    fb.appendChild(b);
  });
  const gb=document.getElementById('qgroup');
  gb.innerHTML='';
  quickGroups().forEach(g=>{
    const b=el('button','gb'+(activeGroups.has(g)?' on':''),g);
    b.setAttribute('aria-pressed',activeGroups.has(g)?'true':'false');
    b.setAttribute('aria-label','Filter by group: '+g);
    b.onclick=()=>{toggleGroup(g);buildQuickChips();loadFree();};
    gb.appendChild(b);
  });
}

// The ⚙ panel holds its own copy of these controls, and both can be on
// screen at once. A chip click that left the panel's floor buttons where they
// were would be two controls disagreeing about one state.
function syncFilterBody(){
  if(document.getElementById('filterModal').classList.contains('show'))buildFilterBody();
}

// The date span of the view on screen used to live here, as [from, to] ISO
// dates for the export links. The links are gone (see syncListLink below);
// maybeRefreshFree derives its own day list, so nothing needs the span any
// more and the function left with them.
function fmtISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// Keep the List tab pointing at what is on screen, so the list opens with
// the filters the calendar is showing. (The toolbar once carried .ics and
// JSON export buttons here too; both the buttons and the server's
// /download endpoints were removed at the user's request — the list is
// the read-only view now.)
function syncListLink(){
  // No floor, capacity or free-at: only the parameters the list can read.
  const lp=[];
  if(activeRooms.size&&activeRooms.size<ROOMS.length)
    lp.push('rooms='+encodeURIComponent([...activeRooms].join(',')));
  if(activeGroups.size)lp.push('groups='+encodeURIComponent([...activeGroups].join(',')));
  if(searchQ)lp.push('q='+encodeURIComponent(searchQ));
  document.getElementById('tab-list').href='/list'+(lp.length?'?'+lp.join('&'):'');
}

// The last_scrape the displayed EVENTS were loaded under. Null until the
// first status reading adopts it; it moves when a scrape finished behind
// this window, which is the moment the grid goes stale.
let EVENTS_AT=null;
// Reload bookings without reloading the page. The URL's filters were read
// once at boot and the user's choices since are theirs to keep: whoever had
// every room active still does (a room added by the scrape joins the active
// set rather than quietly narrowing it), and a deliberate narrowing is not
// silently widened.
async function refreshEvents(){
  try{
    const r=await fetch('/api/bootstrap');
    if(!r.ok)return;
    const d=await r.json();
    const prev=new Set(activeRooms),hadAll=prev.size>=ROOMS.length;
    EVENTS=d.events||[];GROUPS=d.groups||{};ROOM_META=d.room_meta||{};
    ROOMS=d.rooms||[];
    activeRooms=hadAll?new Set(ROOMS):new Set([...prev].filter(rm=>ROOMS.includes(rm)));
    document.getElementById('roomcnt').textContent=ROOMS.length+' rooms';
    buildChips();buildGroupBtns();
    applyFilters();
  }catch(e){}
}

async function boot(){
  try{
    const r=await fetch('/api/bootstrap');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    EVENTS=d.events||[];ROOMS=d.rooms||[];GROUPS=d.groups||{};ROOM_META=d.room_meta||{};
    // GROUPS.Classroom used to be synthesized here as North ∪ South. That made
    // the config's own Classroom entry dead data, and worse, silently reverted
    // any edit made to the group in the panel — the override ran after every
    // load. The union now lives in app/config.py where it is visible and
    // editable, and the server is the single source for the group set.
    activeRooms=new Set(ROOMS);
    document.getElementById('roomcnt').textContent=ROOMS.length+' rooms';
    buildChips();
    buildGroupBtns();
    // After ROOMS and GROUPS are populated and before the first applyFilters:
    // readURL validates its room and group names against both.
    readURL();
  }catch(e){toast('Could not load bookings: '+e.message);}
  applyFilters();
  loadStatus();
  loadFree();
}

async function doLogout(){
  // Ask first, and say what it costs. This is the one control in the app that
  // removes something the user has: the next scrape cannot run without a
  // session, and getting one back means a UTORid login and a Duo approval.
  if(!confirm('Sign out of LSM?\n\nThis clears the session this app keeps for you. '
    +'It will not be able to update your bookings until you sign in again, and '
    +'signing in needs your UTORid and a Duo approval.'))return;

  const link=document.getElementById('logoutLink');
  link.textContent='Signing out…';link.setAttribute('aria-busy','true');

  const done=()=>{link.textContent='Sign out of LSM';link.removeAttribute('aria-busy');loadStatus();};
  try{
    const r=await fetch('/api/logout',{method:'POST'});
    const d=await r.json();
    if(r.status===409){toast('⚠️ '+(d.message||'Busy'));done();return;}

    // The reply only says the request was accepted; the session is cleared by
    // the worker, because it owns the browser profile. So wait for that and
    // then read the result instead of assuming it — the endpoint reports what
    // its probe measured, and "still signed in" is a possible answer.
    const t0=Date.now();
    let sawBusy=false;
    while(Date.now()-t0<60000){
      await new Promise(s=>setTimeout(s,1200));
      const st=await (await fetch('/api/status')).json();
      if(st.busy){sawBusy=true;continue;}
      // A logout that has already finished looks exactly like one that has not
      // started when the only thing you read is `busy`, so the session is the
      // tiebreak: if it is no longer ok, the job is done whether or not it was
      // caught running.
      if(!sawBusy&&st.session==='ok')continue;
      if(st.session==='ok'){
        toast('⚠️ '+(st.session_message||'Could not sign out — still signed in'),true);
        done();
      }else{
        toast('✅ Signed out of LSM',true);
        setTimeout(()=>location.reload(),900);
      }
      return;
    }
    toast('⚠️ Still waiting — see the sidebar',true);
    done();
  }catch(e){toast('❌ '+e.message);done();}
}

async function doLogin(){
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Opening window…';
  try{
    const r=await fetch('/api/login',{method:'POST'});
    const d=await r.json();
    if(r.status===409){toast('⚠️ '+(d.message||'Busy'));btn.disabled=false;btn.textContent='Sign in to LSM';return;}
    toast('A browser window opened — sign in and approve Duo',true);
    const t0=Date.now();
    let sawBusy=false;
    while(Date.now()-t0<6*60*1000){
      await new Promise(s=>setTimeout(s,2500));
      const st=await (await fetch('/api/status')).json();
      if(st.progress)btn.textContent=st.progress.slice(0,30);
      if(st.busy){sawBusy=true;continue;}
      // The POST returns as soon as the command is queued, and `busy` is false
      // both before the worker dequeues it and after the job ends. Treating the
      // first false reading as the end of the job made the UI announce failure
      // one second into a sign-in that then completed successfully.
      if(!sawBusy)continue;
      if(st.session==='ok'){toast('✅ Signed in',true);setTimeout(()=>location.reload(),900);}
      else if(st.session==='no_access'){toast("❌ Signed in, but this account can't open LSM's report");btn.disabled=false;btn.textContent='Sign in to LSM';}
      else{toast('❌ Sign-in did not complete — try again');btn.disabled=false;btn.textContent='Sign in to LSM';}
      return;
    }
    toast(sawBusy?'⚠️ Still waiting — see the sidebar':'⚠️ Sign-in did not start — see the sidebar');
    btn.disabled=false;btn.textContent='Sign in to LSM';
  }catch(e){toast('❌ '+e.message);btn.disabled=false;btn.textContent='Sign in to LSM';}
}

boot();
// Availability moves hour to hour, so refresh the free-room panel on the same
// cadence as the session status rather than only at load.
setInterval(()=>{loadStatus();loadFree();},60000);
</script>
</body>
</html>
