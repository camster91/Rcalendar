<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotman LSM Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Every value below is set so its worst-case pairing clears WCAG AA (4.5:1)
   for normal text — the accent and status colours are used both as text on
   white and as button backgrounds under white text, and the muted greys sit
   on --sf2 rather than pure white. The originals were Tailwind-500-ish and
   mostly landed between 2.1 and 3.8. */
:root{--bg:#f4f6f9;--sf:#fff;--sf2:#f0f3f8;--sf3:#e4e9f0;--bd:#dce2ea;--bd2:#bfc8d4;--tx:#1a2133;--tx2:#4a5568;--tx3:#617082;--ac:#0d64f4;--ac2:#1e6ef5;--acg:#eff6ff;--gn:#0b7e58;--gn2:#04865e;--rd:#dc1313;--og:#a46907;--r:12px;--rs:8px;--sh:0 1px 3px rgba(0,0,0,.06);--sh2:0 8px 24px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
/* The month grid, room chips and free-room pills are divs/spans carrying
   onclick, so they need an explicit role and a visible focus ring to be
   reachable and usable from the keyboard at all. */
[role="button"]{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}

/* ── BAR ── */
.bar{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.bar-l{display:flex;align-items:center;gap:12px}
.logo{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vtabs{display:flex;gap:2px;background:var(--sf2);border-radius:var(--rs);padding:2px}
.vtab{padding:6px 14px;border-radius:6px;font-size:.88rem;font-weight:500;color:var(--tx2);cursor:pointer;border:none;background:none;transition:.15s;text-decoration:none}
a.vtab{display:inline-flex;align-items:center}
.vtab:hover{color:var(--tx)}.vtab.on{background:var(--ac);color:#fff}
.badge{padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:600}
.bg-bl{background:var(--acg);color:var(--ac)}.bg-gr{background:var(--sf2);color:var(--tx2)}
.btn{padding:7px 14px;border-radius:var(--rs);font-size:.88rem;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);display:inline-flex;align-items:center;gap:5px;transition:.15s;text-decoration:none}
.btn:hover{background:var(--sf2);color:var(--tx)}
.btn-a{background:var(--ac);border-color:var(--ac);color:#fff}.btn-a:hover{background:var(--ac2)}
.btn-g{background:var(--gn2);border-color:var(--gn2);color:#fff}

/* ── LAYOUT ── */
.wrap{display:flex;height:calc(100vh - 54px)}
/* overflow:hidden, not auto — the column must never scroll as a whole. The
   room list is the one long thing here and it scrolls inside its own box
   (.sgrow/.rchips); when the column scrolled too, the two fought and the
   rooms you were looking at slid out from under the pointer. */
.side{width:250px;min-width:250px;background:var(--sf);border-right:1px solid var(--bd);overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:14px}
/* The room block takes whatever height the fixed blocks leave. */
.sgrow{flex:1;min-height:90px;display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column}

.stit{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:6px}
.sval{font-size:.92rem;color:var(--tx2);line-height:1.5}
.shist{font-size:.8rem;color:var(--tx3);margin-top:5px}
.sgrow .stit{flex-shrink:0}
.sval strong{color:var(--tx)}
.sess{font-size:.76rem;font-weight:600;margin-bottom:5px}
.sess.ok{color:var(--gn2)}.sess.bad{color:#dc2626}.sess.warn{color:var(--og)}
.btn-w{background:var(--og);border-color:var(--og);color:#fff}

/* Search */
.sbox{position:relative}
.sbox input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--rs);background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-size:.92rem;outline:none}
.sbox input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.sbox .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.92rem;color:var(--tx3)}
.sdrop{position:absolute;top:100%;left:0;right:0;background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rs);box-shadow:var(--sh2);z-index:50;max-height:280px;overflow-y:auto;display:none;margin-top:2px}
.sdrop.show{display:block}
.sdrop-section{padding:6px 10px 3px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3)}
.sdrop-item{padding:7px 10px;font-size:.88rem;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--tx2)}
.sdrop-item:hover{background:var(--sf2);color:var(--tx)}
.sdrop-item .rm{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:500}
.rm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Tags */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:500;display:flex;align-items:center;gap:4px}
.tag-rm{background:var(--acg);color:var(--ac);border:1px solid rgba(59,130,246,.2)}
.tag-grp{background:rgba(245,158,11,.08);color:var(--og);border:1px solid rgba(245,158,11,.2)}
.tag-q{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}
.tag-x{cursor:pointer;opacity:.6;font-size:.78rem;margin-left:2px}.tag-x:hover{opacity:1}

/* Room chips */
.rchips{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow-y:auto}
.rchips::-webkit-scrollbar{width:4px}.rchips::-webkit-scrollbar-thumb{background:var(--sf3);border-radius:4px}
.rc{padding:6px 10px;border-radius:5px;font-size:.88rem;font-weight:500;cursor:pointer;transition:.1s;display:flex;align-items:center;justify-content:space-between;border:1px solid transparent}
.rc:hover{background:var(--sf2)}.rc.on{background:var(--sf2);border-color:var(--bd)}.rc.off{opacity:.25}
.rc .cd{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:7px}
.rc .cn{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--tx3)}
/* Floor subheader inside the room list — sticky so it stays legible while
   scrolling a 99-room column. */
.rfloor{position:sticky;top:0;z-index:1;background:var(--bg);padding:8px 2px 3px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}

/* "Free right now" panel. Two rows: enough to be a glance, not enough to
   push the room list up. It scrolls internally past that. */
.freen{font-family:'JetBrains Mono',monospace;color:var(--gn,#22c55e)}
.freelist{display:flex;flex-wrap:wrap;gap:4px;max-height:62px;overflow-y:auto}
.freelist::-webkit-scrollbar{width:4px}.freelist::-webkit-scrollbar-thumb{background:var(--sf3);border-radius:4px}
.freeload{font-size:.78rem;color:var(--tx3)}
.free{padding:3px 7px;border-radius:5px;background:var(--sf2);border:1px solid var(--bd);font-size:.76rem;font-family:'JetBrains Mono',monospace;color:var(--tx2);cursor:pointer}
.free:hover{background:var(--sf3)}
.free.busy{border-color:var(--rd,#ef4444);color:var(--tx3)}
.freenone{font-size:.78rem;color:var(--tx3)}

/* Group filters — multi-select */
.gbar{display:flex;gap:5px;flex-wrap:wrap}
.gb{padding:5px 12px;border-radius:5px;font-size:.82rem;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);transition:.12s;user-select:none}
.gb:hover{color:var(--tx);background:var(--sf2)}.gb.on{background:var(--ac);border-color:var(--ac);color:#fff}

/* ── CALENDAR ── */
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.chead h2{font-size:1.5rem;font-weight:700}
.cnav{display:flex;gap:6px;align-items:center}
.cnav button{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--sf);color:var(--tx2);cursor:pointer;font-size:.92rem;display:flex;align-items:center;justify-content:center;transition:.12s}
.cnav button:hover{background:var(--sf2);color:var(--tx)}
.cnav .td{width:auto;padding:0 16px;font-size:.88rem;font-weight:500}

/* Responsive grid: fill available height */
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1;min-height:0}
.cdhead{padding:8px 4px;text-align:center;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);background:var(--sf2);border-radius:6px 6px 0 0}
.cday{padding:4px 6px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;cursor:pointer;transition:.1s;overflow:hidden;display:flex;flex-direction:column}
.cday:hover{border-color:var(--bd2);box-shadow:0 1px 4px rgba(0,0,0,.04)}.cday.tdy{border:2px solid var(--ac);box-shadow:0 0 0 2px rgba(59,130,246,.1)}.cday.oth{opacity:.35}
.cday-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.cday-n{font-size:.92rem;font-weight:700;color:var(--tx2);font-family:'JetBrains Mono',monospace}
.cday.tdy .cday-n{color:var(--ac)}
.cday-evts{flex:1;overflow:hidden;position:relative}
.cday-evts .cev:nth-child(n+5),.cday-evts .cad:nth-child(n+5){display:none}
.cday.showall .cday-evts .cev,.cday.showall .cday-evts .cad{display:block!important}
.cday-evts .cmr{display:block}
.cday.showall .cday-evts .cmr{display:none!important}
.cev{padding:2px 6px;border-radius:3px;font-size:.78rem;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.4;user-select:text;color:#fff}
.cev:hover{filter:brightness(1.1)}
.cev .crm{font-weight:700}
/* Full-day blocks (003/RENOVATIONS etc). A tinted strip, not a timed bar —
   they used to render as "12:00 a.m. → 11:00 p.m." and crowd out real bookings. */
.cad{padding:1px 6px;border-left:3px solid;border-radius:3px;background:var(--sf2);color:var(--tx2);font-size:.72rem;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cad:hover{background:var(--sf3)}
.cmr{font-size:.72rem;color:var(--ac);font-weight:500;padding:2px 4px;cursor:pointer;display:block}
.cmr:hover{text-decoration:underline}

/* Week */
.wkgrid{display:grid;grid-template-columns:64px repeat(7,1fr)}
.wkt{padding:4px 8px;font-size:.78rem;font-family:'JetBrains Mono',monospace;color:var(--tx3);text-align:right;border-top:1px solid var(--bd);height:56px;display:flex;align-items:flex-start;justify-content:flex-end}
.wkc{border-top:1px solid var(--bd);border-left:1px solid var(--bd);position:relative;height:56px;min-width:0;overflow:hidden}
.wkc:hover{background:rgba(59,130,246,.03)}
.wkdh{text-align:center;padding:8px 4px;font-size:.88rem;font-weight:600;background:var(--sf2);border-left:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.wkdh.tdy{color:var(--ac);background:var(--acg)}.wkdh .wn{font-size:.78rem;color:var(--tx3);font-weight:400}
.wkev{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 6px;font-size:.78rem;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:2;color:#fff}
/* All-day strip above the week grid. */
.wkadrow{display:flex;flex-wrap:wrap;gap:5px;padding:6px 4px 8px}
.wkad{padding:2px 8px;border-left:3px solid;border-radius:3px;background:var(--sf2);color:var(--tx2);font-size:.76rem;font-weight:600;cursor:pointer;max-width:290px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wkad:hover{background:var(--sf3)}

/* ── TODAY VIEW ── */
.today-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.today-hd h2{font-size:1.5rem;font-weight:700}
.td-nav{display:flex;gap:6px;align-items:center}
.td-nav button{width:36px;height:36px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--sf);color:var(--tx2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;font-size:.88rem}
.td-nav button:hover{background:var(--sf2);color:var(--tx)}
.td-nav .td{width:auto;padding:0 16px}
.timeline{display:flex;flex-direction:column}
.tl-hour{display:grid;grid-template-columns:80px 1fr;border-top:1px solid var(--bd);min-height:52px}
.tl-time{padding:10px 12px 0 0;font-family:'JetBrains Mono',monospace;font-size:.88rem;color:var(--tx3);text-align:right;font-weight:500}
.tl-slots{padding:8px 0;min-height:52px}

/* ── EVENT CARD (copyable) ── */
.evcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:14px 18px;margin-bottom:8px;user-select:text;transition:.1s;border-left:4px solid var(--ac);position:relative}
.evcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.05)}
.evcard .etitle{font-weight:600;font-size:.98rem;color:var(--tx);margin-bottom:4px;word-break:break-word;padding-right:28px}
.evcard .etime{font-family:'JetBrains Mono',monospace;font-size:.88rem;color:var(--ac);margin-bottom:3px;white-space:nowrap}
.evcard .etime em{font-style:normal;letter-spacing:.04em;text-transform:uppercase;font-size:.78rem}
/* All-day blocks are context, not bookings — quieter than a timed card. */
.evcard.allday{background:var(--sf2)}
.evcard.allday .etime{color:var(--tx3)}
.evcard .eroom{font-size:.88rem;color:var(--tx2);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.evcard .eroom .rd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.evcard .edesc{font-size:.85rem;color:var(--tx3);margin-top:5px;line-height:1.4;word-break:break-word}
.evcard .ecopy{position:absolute;top:10px;right:10px;cursor:pointer;font-size:.88rem;color:var(--tx3);opacity:0;transition:.15s;padding:4px 8px;border-radius:4px;background:var(--sf2)}
.evcard:hover .ecopy{opacity:.6}.evcard .ecopy:hover{opacity:1!important}

/* Tooltip — don't close when selecting text */
.tip{position:fixed;z-index:9999;background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:14px 18px;max-width:340px;box-shadow:var(--sh2);display:none;user-select:text}
.tip-t{font-weight:600;font-size:.95rem;margin-bottom:5px}
.tip-tm{font-family:'JetBrains Mono',monospace;font-size:.88rem;color:var(--ac);margin-bottom:4px}
.tip-r{font-size:.88rem;color:var(--tx2)}
.tip-d{font-size:.82rem;color:var(--tx3);margin-top:6px;line-height:1.5}

/* Modal — click inside doesn't close */
.mover{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;justify-content:center;align-items:center;backdrop-filter:blur(3px)}.mover.show{display:flex}
.modal{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:24px;max-width:680px;width:92%;max-height:80vh;overflow-y:auto;box-shadow:var(--sh2);user-select:text}
.modal h2{font-size:1.15rem;margin-bottom:18px}.mcl{float:right;cursor:pointer;font-size:1.3rem;color:var(--tx3);background:none;border:none;padding:4px}.mcl:hover{color:var(--tx)}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:12px 20px;font-size:.92rem;z-index:9999;box-shadow:var(--sh2);display:none;animation:si .3s}
.toast.ok{border-color:var(--gn)}
@keyframes si{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── CHANGE FEED ── */
/* Additions and removals between scrapes. Colour is carried by the left border
   and the kind label together, so the meaning survives without the colour. */
.daysep{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 2px 6px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);border-bottom:1px solid var(--bd);margin-bottom:8px}
.daysep:first-child{padding-top:0}
.daysep .dc{font-weight:500;text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--tx3)}
.chg{display:flex;align-items:flex-start;gap:12px;background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--bd2);border-radius:var(--rs);padding:9px 14px;margin-bottom:6px}
.chg.added{border-left-color:var(--gn)}
.chg.removed{border-left-color:var(--rd)}
.chg-kind{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;width:70px;padding-top:2px;color:var(--tx3)}
.chg.added .chg-kind{color:var(--gn)}
.chg.removed .chg-kind{color:var(--rd)}
.chg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chg-t{font-weight:600;font-size:.92rem;color:var(--tx);word-break:break-word}
.chg-m{font-size:.8rem;color:var(--tx2)}
.chg-m .mono{font-family:'JetBrains Mono',monospace}
.chg-when{font-size:.75rem;color:var(--tx3);white-space:nowrap;flex-shrink:0;padding-top:2px}

/* ── FILTER PANEL ── */
/* Reuses .mover/.modal/.mcl from the day modal, and the sidebar's own chip
   classes (.gbar/.gb, .stit, .rc/.rfloor, .tag) rather than inventing a second
   vocabulary for the same controls. */
.fmodal{width:min(680px,94vw);max-height:86vh;overflow-y:auto}
.fsec{margin-bottom:20px}
.fsec:last-of-type{margin-bottom:12px}
.fnote{font-size:.78rem;color:var(--tx3);margin-top:6px;line-height:1.45}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.frow label{font-size:.85rem;color:var(--tx2);min-width:74px}
.frow input[type=time],.frow input[type=number],.frow input[type=text],.frow select{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rs);color:var(--tx);padding:5px 8px;font:inherit;font-size:.85rem}
.frow input[type=text]{min-width:150px}
.fempty{font-size:.85rem;color:var(--tx3);padding:4px 0}
.fgrp{border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;margin-bottom:10px;background:var(--sf)}
.fgrp-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fgrp-hd input{flex:1;background:var(--bg);border:1px solid var(--bd2);border-radius:var(--rs);color:var(--tx);padding:5px 8px;font:inherit;font-size:.85rem;font-weight:600}
.fgrp-rooms{max-height:132px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:4px;padding:2px 0}
.fgrp-rooms .rc{font-size:.74rem;padding:2px 7px}
.fdel{background:none;border:1px solid var(--bd2);border-radius:var(--rs);color:var(--rd);cursor:pointer;font:inherit;font-size:.8rem;padding:4px 9px}
.fdel:hover{border-color:var(--rd)}
.ftags{display:flex;flex-wrap:wrap;gap:6px}
.ftags .tag{cursor:pointer}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}

@media(max-width:900px){.side{display:none}.wrap{flex-direction:column}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-l">
    <div class="logo"><span class="dot"></span> Rotman Room Bookings</div>
    <span class="badge bg-bl" id="roomcnt">— rooms</span>
    <span class="badge bg-gr" id="evcnt">— events</span>
  </div>
  <div class="bar-r">
    <div class="vtabs">
      <button class="vtab" id="v-month" onclick="setView('month')">📅 Month</button>
      <button class="vtab" id="v-week" onclick="setView('week')">📊 Week</button>
      <button class="vtab on" id="v-today" onclick="setView('today')">📋 Today</button>
      <button class="vtab" id="v-changes" onclick="setView('changes')">🔀 Changes</button>
      <a class="vtab" id="tab-list" href="/list">☰ List</a>
    </div>
    <button class="btn btn-a" id="scrapeBtn" onclick="triggerScrape()" title="Scrape LSM now">⟳</button>
    <a class="btn btn-g" data-export="/download/ics" href="/download/ics" title="Export the current view">⬇ .ics</a>
    <a class="btn" data-export="/download/json" href="/download/json" title="Export the current view">⬇ JSON</a>
  </div>
</div>

<div class="wrap">
<div class="side">
  <!-- Controls first, in the order they get used: find a room, narrow by
       group, pick from the list. The list takes whatever height is left and
       is the only thing here that scrolls. -->
  <div>
    <div class="stit">Search</div>
    <div class="sbox">
      <span class="si">🔍</span>
      <input type="text" id="q" placeholder="Room, group, event..." aria-label="Search bookings by room, group or event" autocomplete="off" oninput="onSearch()" onfocus="onSearch()" onblur="setTimeout(()=>closeDrop(),200)">
      <div class="sdrop" id="sdrop"></div>
    </div>
    <div class="tags" id="tags"></div>
    <!-- Opens the filter panel. Floor, seats, Panopto and free-at need more
         room than the column has left, so they live over the calendar in a
         panel rather than in a sidebar that is already full. -->
    <button class="btn" id="filterBtn" onclick="openFilters()">⚙ Filters <span id="advN"></span></button>
  </div>
  <div>
    <div class="stit">Filter by Group</div>
    <!-- Built by buildGroupBtns(), not written out here: a renamed or added
         group would otherwise never appear. -->
    <div class="gbar" id="gbar"></div>
  </div>
  <div class="sgrow">
    <div class="stit">Rooms <span style="font-weight:400;text-transform:none;letter-spacing:0;cursor:pointer;font-size:.78rem;color:var(--ac)" onclick="roomClear()">clear</span></div>
    <div class="rchips" id="rchips"></div>
  </div>
  <!-- Everything below is read-only. -->
  <div>
    <div class="stit">Free Right Now <span class="freen" id="freeN"></span></div>
    <div class="freelist" id="freeList"><span class="freeload">checking…</span></div>
  </div>
  <div>
    <div class="stit">Status</div>
    <div id="sessInfo" class="sess"></div>
    <div class="sval" id="scrapeInfo"><strong>loading…</strong></div>
    <div class="sval shist" id="histInfo"></div>
    <button class="btn btn-w" id="loginBtn" onclick="doLogin()" style="display:none;width:100%;margin-top:8px">Sign in to LSM</button>
  </div>
</div>
<div class="main" id="mainArea"></div>
</div>

<div class="tip" id="tip" onmousedown="event.stopPropagation()"><div class="tip-t" id="tipT"></div><div class="tip-tm" id="tipD"></div><div class="tip-r" id="tipR"></div><div class="tip-d" id="tipDe"></div></div>
<div class="toast" id="toast"></div>
<div class="mover" id="dayModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">
    <button class="mcl" onclick="closeOverlays()" aria-label="Close">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<!-- The filter panel. Same overlay machinery as the day modal, and outside
     .bar and .side so the modal's tabindex suppression does not disable its
     own controls. -->
<div class="mover" id="filterModal">
  <div class="modal fmodal" role="dialog" aria-modal="true" aria-labelledby="filterTitle" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">
    <button class="mcl" onclick="closeOverlays()" aria-label="Close">✕</button>
    <h2 id="filterTitle">Filters</h2>
    <div id="filterBody"></div>
  </div>
</div>

<script src="/filters.js"></script>
<script>
// Populated from /api/bootstrap on startup (see boot() at the bottom).
let EVENTS = [];
let ROOMS = [];
let GROUPS = {};
// Room number -> {display, floor, capacity, panopto}. /api/bootstrap has always
// returned this; the page used to fetch and discard it, which is why the
// sidebar read as 99 unlabelled numbers.
let ROOM_META = {};

// Room colours, rcol(), fmtT/fmtDur/fmtDay, esc, mergeEvts and parseFilters
// live in /filters.js, shared with list.html. Declaring any of them here as
// well is a parse-time error, not an override.

// ── STATE ──
let viewMode = 'today';
let curDate = new Date();
let activeRooms = new Set(ROOMS);
let activeGroups = new Set(); // multi-select
let searchQ = '';

// Advanced filters, ANDed onto the room/search core by applyFilters(). Each
// defaults to "no opinion", so with none of them set the filter pass is exactly
// the one it has always been.
let advFloors = new Set();   // empty = every floor
let advSeats = 0;            // 0 = no minimum
let advPanopto = false;      // only rooms the report flags for Panopto
let advFreeAt = '';          // "14:00"; empty = off
let advFreeMins = 60;
// Rooms free for the window, per day, from /api/today?dates= — a Map of
// day -> Set(room). Per day because the question is asked of a span: the month
// and week views draw bookings from many days at once, and applying one day's
// answer to all of them made a room booked every day of the month read as free.
// Null means "not fetched yet", which applyFilters treats as no opinion rather
// than as "nothing is free" — a filter that blanks the calendar while a request
// is in flight reads as a bug.
let FREE_DAYS = null;

// Events shown per month cell before "+N more". Must match the nth-child
// cut-off in the stylesheet — the label used to be computed as length-3 while
// CSS hid from the 5th child, so it always undercounted by one.
const MONTH_MAX = 4;

// ── MERGE ──
// mergeEvts is in /filters.js — one row per booking, `rooms` listing every room
// it occupies.

// ── ROOM CHIPS ──
function buildChips(){
  const rCnt={};EVENTS.forEach(e=>{rCnt[e.room]=(rCnt[e.room]||0)+1;});
  const cDiv=document.getElementById('rchips');
  cDiv.innerHTML='';
  // ROOMS arrives already sorted by (floor, room), so a subheader whenever
  // the floor changes turns 99 undifferentiated chips into a navigable list.
  let lastFloor=null;
  ROOMS.forEach(r=>{
    if(!rCnt[r])return;
    const meta=ROOM_META[r]||{};
    const floor=meta.floor||'';
    if(floor&&floor!==lastFloor){
      const h=document.createElement('div');h.className='rfloor';h.textContent=floor;
      cDiv.appendChild(h);lastFloor=floor;
    }
    const d=document.createElement('div');d.className='rc on';d.dataset.room=r;
    d.setAttribute('role','button');
    d.tabIndex=0;
    d.title=(meta.display||('Room '+r))+(meta.capacity?(' · '+meta.capacity+' seats'):'')+(meta.notes?(' · '+meta.notes):'');
    d.setAttribute('aria-label',(meta.display||('Room '+r))+', '+rCnt[r]+' bookings');
    // Elements, not an html string: a room number comes from the report and is
    // written into this chip in two places.
    const top=document.createElement('span');top.style.cssText='display:flex;align-items:center';
    const dot=document.createElement('span');dot.className='cd';dot.style.background=rcol(r, ROOMS);
    const name=document.createElement('span');name.textContent=r;
    const cnt=document.createElement('span');cnt.className='cn';cnt.textContent=rCnt[r];
    top.append(dot,name);d.append(top,cnt);
    d.onclick=()=>toggleRoom(r);cDiv.appendChild(d);
  });
  syncChips();
}
function toggleRoom(r){if(activeRooms.has(r))activeRooms.delete(r);else activeRooms.add(r);syncChips();applyFilters();}
// Scoped to #rchips. The filter panel's group editor also draws room toggles,
// and a global .rc selector would repaint those from the room filter — which is
// a different question from group membership. Same for the group buttons.
function syncChips(){document.querySelectorAll('#rchips .rc').forEach(c=>{const on=activeRooms.has(c.dataset.room);c.classList.toggle('on',on);c.classList.toggle('off',!on);c.setAttribute('aria-pressed',on?'true':'false')});}
// With no group filter active there is nothing to fall back to, so clearing
// used to leave activeRooms empty and blank the entire calendar with no way
// back. Falling back to "all rooms" is the only sane meaning of clear.
function roomClear(){
  activeRooms.clear();
  if(activeGroups.size){let rs=[];activeGroups.forEach(g=>rs.push(...(GROUPS[g]||[])));activeRooms=new Set(rs.filter(r=>ROOMS.includes(r)));}
  else{activeRooms=new Set(ROOMS);}
  syncChips();applyFilters();
}

// ── MULTI-SELECT GROUP FILTER ──
// Generated rather than hardcoded, so a group added in the editor appears here
// without a code change. Built with DOM calls, not an html string: a group name
// is user-controlled once the editor ships, and concatenating one into markup
// or into an onclick attribute lets a quote in the name break out of it.
function buildGroupBtns(){
  const bar=document.getElementById('gbar');
  bar.innerHTML='';
  const add=(label,g)=>{
    const b=document.createElement('button');
    b.className='gb';b.dataset.g=g;b.textContent=label;
    b.onclick=()=>toggleGroup(g);
    bar.appendChild(b);
  };
  add('All','');
  Object.keys(GROUPS).forEach(g=>add(g==='Classroom'?'🏫 '+g:g,g));
  syncGroupBtns();
}
// The rooms a group selection implies. toggleGroup and readURL both need this,
// and a URL that set activeGroups without it lit the group's button while the
// room list stayed at every room — a filter that looked applied and was not.
function roomsForGroups(){
  const rs=[];
  activeGroups.forEach(grp=>rs.push(...(GROUPS[grp]||[])));
  return new Set(rs.filter(r=>ROOMS.includes(r)));
}
function toggleGroup(g){
  if(!g){activeGroups.clear();activeRooms=new Set(ROOMS);}
  else{
    if(activeGroups.has(g))activeGroups.delete(g);else activeGroups.add(g);
    activeRooms=roomsForGroups();
  }
  syncGroupBtns();syncChips();applyFilters();
}
function syncGroupBtns(){
  document.querySelectorAll('#gbar .gb').forEach(b=>{
    const g=b.dataset.g;
    b.classList.toggle('on',!g?activeGroups.size===0:activeGroups.has(g));
  });
}

// ── SEARCH ──
let debounce;
function onSearch(){clearTimeout(debounce);debounce=setTimeout(()=>{const v=document.getElementById('q').value.trim();if(v.length<1){closeDrop();applyFilters();return;}fetch('/api/autocomplete?q='+encodeURIComponent(v)).then(r=>r.json()).then(d=>showDrop(d));searchQ=v.toLowerCase();applyFilters();},200);}
// Built as elements with textContent. The old version interpolated each value
// straight into an onmousedown attribute, so a group name or event title
// containing an apostrophe broke out of the string and injected markup — and
// group names became user-controlled the moment the group editor shipped.
function showDrop(d){
  const box=document.getElementById('sdrop');
  box.innerHTML='';
  const section=t=>{const h=document.createElement('div');h.className='sdrop-section';h.textContent=t;box.appendChild(h);};
  const item=(type,value,dot,label)=>{
    const el=document.createElement('div');
    el.className='sdrop-item';
    if(dot){const s=document.createElement('span');s.className='rm-dot';s.style.background=rcol(value, ROOMS);el.appendChild(s);}
    const s=document.createElement('span');s.className='rm';s.textContent=label===undefined?value:label;
    el.appendChild(s);
    el.onmousedown=()=>addTag(type,value);
    box.appendChild(el);
  };
  if(d.groups.length){section('Groups');d.groups.forEach(g=>item('group',g));}
  if(d.rooms.length){section('Rooms');d.rooms.forEach(r=>item('room',r,true));}
  if(d.titles.length){section('Events');d.titles.forEach(t=>item('query',t));}
  box.classList.add('show');
}
function closeDrop(){document.getElementById('sdrop').classList.remove('show');}
const tags=[];
function addTag(type,value){if(tags.some(t=>t.type===type&&t.value===value))return;tags.push({type,value});if(type==='group')toggleGroup(value);else if(type==='room'){activeRooms.clear();activeRooms.add(value);syncChips();}else{searchQ=value.toLowerCase();document.getElementById('q').value='';}closeDrop();renderTags();applyFilters();}
function removeTag(idx){const t=tags.splice(idx,1)[0];if(t.type==='group'){toggleGroup(t.value);}else if(t.type==='room'){activeRooms=new Set(ROOMS);syncChips();}else{searchQ='';document.getElementById('q').value='';}renderTags();applyFilters();}
// textContent again: t.value is the raw search text or a group name, and the
// old version wrote it into the page as markup.
function renderTags(){
  const box=document.getElementById('tags');
  box.innerHTML='';
  tags.forEach((t,i)=>{
    const cls=t.type==='room'?'tag-rm':t.type==='group'?'tag-grp':'tag-q';
    const lbl=t.type==='room'?'Room '+t.value:t.type==='group'?'📁 '+t.value:t.value;
    const el=document.createElement('span');
    el.className='tag '+cls;el.textContent=lbl;
    const x=document.createElement('span');
    x.className='tag-x';x.textContent='✕';
    x.onclick=()=>removeTag(i);
    el.appendChild(x);
    box.appendChild(el);
  });
}

// ── VIEW ──
function setView(v){viewMode=v;document.querySelectorAll('.vtab').forEach(b=>b.classList.remove('on'));document.getElementById('v-'+v).classList.add('on');render();}

// ── FILTER ──
// The search box and searchQ are the same value kept in two places: onSearch
// rewrites searchQ from the box, and addTag clears the box. They are deduped
// rather than concatenated — the feed used to join them into a single LIKE term
// and send "smith smith", which matches nothing.
function searchTerms(){
  return [...new Set([searchQ,document.getElementById('q').value.trim().toLowerCase()].filter(Boolean))];
}
let filtered=EVENTS;
function applyFilters(){
  const terms=searchTerms();
  filtered=EVENTS.filter(e=>{
    if(!activeRooms.has(e.room))return false;
    if(terms.length&&!terms.some(s=>((e.title||'')+e.room+(e.description||'')).toLowerCase().includes(s)))return false;
    const m=ROOM_META[e.room]||{};
    // Strict for floor, lenient for capacity, and the difference is deliberate:
    // a floor is a partition, so a room with no recorded floor is not on the
    // one you selected; a capacity is a threshold, so a room with no recorded
    // capacity still passes a minimum. The panel states both, and offers
    // "No floor" so the strict reading is something you can select for.
    if(advFloors.size&&!advFloors.has(floorOf(e.room)))return false;
    // An unknown capacity PASSES a minimum. 49 of the 91 rooms have no recorded
    // capacity, and silently hiding half the building from "seats >= 20" is
    // worse than showing a room that might be too small. It must be Infinity,
    // not 0 — 0 would hide every one of them. The panel states the count so the
    // leniency is visible rather than a surprise.
    if(advSeats&&(m.capacity??Infinity)<advSeats)return false;
    if(advPanopto&&!m.panopto)return false;
    // FREE_DAYS === null means the fetch has not landed; showing everything
    // briefly beats showing nothing.
    if(advFreeAt&&FREE_DAYS&&!freeOn(e))return false;
    return true;
  });
  advCount();
  document.getElementById('evcnt').textContent=filtered.length+' events';render();
}

// How many advanced filters are on, so the sidebar button says so with the
// panel closed. Rooms and search are not counted — they have their own chips
// and their own place in the column.
function advCount(){
  const n=advFloors.size+(advSeats?1:0)+(advPanopto?1:0)+(advFreeAt?1:0);
  const el=document.getElementById('advN');
  if(el)el.textContent=n?'· '+n:'';
}

// ── HELPERS ──
// DAYS, MONTHS, fmtT, fmtDur, fmtDay and esc are in /filters.js.
// Tooltip payload for a month chip. Shared by the timed and all-day variants so
// the two cannot drift apart.
function tipAttrs(ev){return 'onclick="event.stopPropagation();showTip(event,this)" data-title="'+esc(ev.title)+'" data-start="'+esc(ev.start)+'" data-end="'+esc(ev.end||'')+'" data-rooms="'+esc(ev.rooms.join(','))+'" data-desc="'+esc(ev.description||'')+'"';}
function copyCard(ev){const rooms=ev.rooms||[ev.room];const txt=(ev.title||'')+'\n'+fmtDay(ev.start)+', '+fmtT(ev.start)+(ev.end?' → '+fmtT(ev.end):'')+'\n'+(rooms.length>1?'Rooms ':'Room ')+rooms.join(', ')+(ev.description?' • '+ev.description:'');navigator.clipboard.writeText(txt).then(()=>toast('Copied!')).catch(()=>{});}
function cardHTML(ev){const c=rcol(ev.rooms?ev.rooms[0]:ev.room, ROOMS);const bc=ev.rooms&&ev.rooms.length>1?'var(--og)':c;
  // An all-day block has no meaningful clock time — its start is just midnight.
  // Printing "12:00 a.m. → 11:00 p.m. (23h)" reads as a real 23-hour booking.
  const when=ev.all_day?'<em>All day</em>':fmtT(ev.start)+(ev.end?' → '+fmtT(ev.end):'')+(fmtDur(ev.start,ev.end)?' <span style="color:var(--tx3);font-size:.78rem">('+fmtDur(ev.start,ev.end)+')</span>':'');
  return '<div class="evcard'+(ev.all_day?' allday':'')+'" style="border-left-color:'+bc+'"><span class="ecopy" data-ev="'+evAttr(ev)+'" title="Copy">📋</span><div class="etitle">'+esc(ev.title||'')+'</div><div class="etime">'+when+'</div><div class="eroom">'+(ev.rooms||[ev.room]).map(r=>'<span class="rd" style="background:'+rcol(r, ROOMS)+'"></span>'+esc(r)).join(' ')+(ev.description?' <span style="color:var(--tx3)">• '+esc(ev.description)+'</span>':'')+'</div></div>';}

// The copy button's payload is data, so it is read back as data: see evAttr
// in /filters.js for what the old inline handler let through. One delegate
// covers every card in every view, since the cards are rebuilt by innerHTML
// and would otherwise each need a listener reattached per render. The old
// handler's stopPropagation is gone because nothing listens for a click on
// .evcard — it was guarding a handler that does not exist.
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.ecopy');
  if(!b)return;
  const ev=evFromAttr(b.dataset.ev);
  if(ev)copyCard(ev);
});

// ── RENDER ──
// The export links depend on the view and the date being shown, both of which
// change without going through applyFilters() — setView(), nav() and goToday()
// all call render() directly, so hanging the sync off the filter pass left the
// month view advertising today's single-day export.
// writeURL and maybeRefreshFree hang off render() for the same reason the
// export links do: setView(), nav() and goToday() all reach render() without
// going through applyFilters(), and both the URL's `date`/`view` and the
// free-at answer depend on which day is on screen. maybeRefreshFree is a no-op
// unless the free-at filter is on, and it is keyed on date+time+length, so the
// extra call from applyFilters' own render cannot loop.
function render(){syncExportLinks();writeURL();maybeRefreshFree();if(viewMode==='month')renderMonth();else if(viewMode==='week')renderWeek();else if(viewMode==='changes')renderChanges();else renderToday();}

function renderMonth(){
  const y=curDate.getFullYear(),m=curDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),so=first.getDay(),td=last.getDate(),now=new Date();
  let h='<div class="chead"><div class="cnav"><button onclick="nav(-1)">◀</button><button class="td" onclick="goToday()">Today</button><button onclick="nav(1)">▶</button></div><h2>'+MONTHS[m]+' '+y+'</h2><span class="badge bg-bl">'+filtered.length+' events</span></div>';
  h+='<div class="cgrid">';DAYS.forEach(d=>{h+='<div class="cdhead">'+d+'</div>';});
  const total=Math.ceil((so+td)/7)*7;
  for(let i=0;i<total;i++){
    const dn=i-so+1;let date,oth=false;
    if(dn<1){date=new Date(y,m,dn);oth=true;}else if(dn>td){date=new Date(y,m,dn);oth=true;}else{date=new Date(y,m,dn);}
    // fmtISO, not toISOString().slice(0,10): the latter converts to UTC, and
    // these dates are local midnight, so west of Greenwich every cell was
    // labelled with the day before. Same bug in renderWeek and renderToday.
    const tdy=date.toDateString()===now.toDateString(),ds=fmtISO(date);
    const de=mergeEvts(filtered.filter(e=>(e.start||'').startsWith(ds)));
    // Focusable with a spoken label: the cell opens the day's full list, and
    // making all 150 chips individually tabbable would bury that behind a
    // hundred keypresses.
    const dLabel=date.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})+' — '+de.length+(de.length===1?' booking':' bookings');
    h+='<div class="cday'+(tdy?' tdy':'')+(oth?' oth':'')+'" role="button" tabindex="0" aria-label="'+esc(dLabel)+'" onclick="openDay(\''+ds+'\')">';
    h+='<div class="cday-hd"><span class="cday-n">'+date.getDate()+'</span></div>';
    h+='<div class="cday-evts">';
    // All-day blocks sort to the top and render as a strip; everything else is
    // a timed bar. Sorting is stable, so same-kind events keep time order.
    de.sort((a,b)=>(b.all_day?1:0)-(a.all_day?1:0));
    de.forEach(ev=>{
      const c=rcol(ev.rooms[0], ROOMS),rl=ev.rooms.length>1?ev.rooms.length+' rms':ev.rooms[0];
      if(ev.all_day){h+='<div class="cad" style="border-left-color:'+c+'" '+tipAttrs(ev)+'>'+esc(ev.title)+'</div>';return;}
      // Room first: "is 142 free that day?" is the question a month grid
      // answers, and the room is what the eye scans for.
      h+='<div class="cev" style="background:'+c+'" '+tipAttrs(ev)+'><span class="crm">'+esc(rl)+'</span> '+fmtT(ev.start)+' '+esc(ev.title)+'</div>';
    });
    if(de.length>MONTH_MAX)h+='<span class="cmr" onclick="event.stopPropagation();this.parentElement.parentElement.classList.toggle(\'showall\')">+'+(de.length-MONTH_MAX)+' more</span>';
    h+='</div></div>';
  }
  h+='</div>';document.getElementById('mainArea').innerHTML=h;
  // Make grid rows fill available height
  requestAnimationFrame(()=>{const g=document.querySelector('.cgrid');if(!g)return;const rows=g.children.length/7+7;const hds=7;const avh=g.clientHeight;const rh=Math.max(Math.floor((avh-hds*30)/6),60);g.style.gridAutoRows='auto';g.querySelectorAll('.cday').forEach(d=>d.style.minHeight=rh+'px');});
}

function renderWeek(){
  const now=new Date();
  // Local midnight, not a copy of curDate with the date rolled back. The
  // window was `new Date(curDate)` — which keeps curDate's *time of day*, and
  // readURL sets curDate to noon so the URL is unambiguous — so the week began
  // at Sunday 12:00 while inWeek compares instants. Every booking on the
  // Sunday before noon fell outside its own week, and an all-day row starts at
  // midnight, so the whole Sunday of the all-day strip disappeared. The bound
  // had the mirror fault: it ran to the next Sunday at 12:00, so that Sunday's
  // morning belonged to the week before it. Both bounds are local midnights
  // now, half-open at the end — the same rule avail.py uses, since the two are
  // answering about the same days.
  const sow=new Date(curDate.getFullYear(),curDate.getMonth(),
                     curDate.getDate()-curDate.getDay());
  const eow=new Date(sow.getFullYear(),sow.getMonth(),sow.getDate()+6);
  // The grid used to be hard-coded to 07:00-22:00, which silently dropped
  // 6.8% of bookings (early-morning and late-evening ones) while the badge
  // above counted them. Widen the range to whatever the week actually holds.
  const wkEnd=new Date(sow.getFullYear(),sow.getMonth(),sow.getDate()+7);
  const inWeek=ev=>{if(!ev.start)return false;const d=new Date(ev.start);return d>=sow&&d<wkEnd;};
  const allDayWeek=mergeEvts(filtered.filter(ev=>ev.all_day&&inWeek(ev)));
  const weekEvts=filtered.filter(ev=>!ev.all_day&&ev.end&&inWeek(ev));
  let H0=7,H1=22;
  weekEvts.forEach(ev=>{H0=Math.min(H0,new Date(ev.start).getHours());const eh=new Date(ev.end);H1=Math.max(H1,eh.getHours()+(eh.getMinutes()?1:0));});
  H1=Math.min(H1,23);
  // All-day blocks get their own strip above the grid rather than being
  // dropped: they have no hour to land on, and silently omitting them made the
  // week view disagree with the month view about the same week.
  const adStrip=allDayWeek.length?'<div class="wkadrow">'+allDayWeek.map(ev=>'<div class="wkad" style="border-left-color:'+rcol(ev.room, ROOMS)+'" '+tipAttrs(ev)+'>'+esc(fmtDay(ev.start).slice(0,3)+' · '+ev.title)+'</div>').join('')+'</div>':'';
  let h='<div class="chead"><div class="cnav"><button onclick="nav(-1)">◀</button><button class="td" onclick="goToday()">Today</button><button onclick="nav(1)">▶</button></div><h2>'+MONTHS[sow.getMonth()]+' '+sow.getDate()+' – '+MONTHS[eow.getMonth()]+' '+eow.getDate()+', '+eow.getFullYear()+'</h2><span class="badge bg-bl">'+filtered.length+' events</span></div>'+adStrip+'<div class="wkgrid"><div class="cdhead" style="border-left:none"></div>';
  for(let d=0;d<7;d++){const day=new Date(sow);day.setDate(sow.getDate()+d);h+='<div class="wkdh'+(day.toDateString()===now.toDateString()?' tdy':'')+'">'+DAYS[d]+'<br><span class="wn">'+day.getDate()+'</span></div>';}
  const hours=[];for(let hr=H0;hr<=H1;hr++)hours.push(hr);
  hours.forEach(hr=>{const lb=hr>12?(hr-12)+' PM':hr===12?'12 PM':hr+' AM';h+='<div class="wkt">'+lb+'</div>';for(let d=0;d<7;d++){h+='<div class="wkc" data-date="'+fmtISO(new Date(sow.getFullYear(),sow.getMonth(),sow.getDate()+d))+'" data-hour="'+hr+'"></div>';}});
  h+='</div>';document.getElementById('mainArea').innerHTML=h;
  weekEvts.forEach(ev=>{const st=new Date(ev.start),en=new Date(ev.end);const ds=fmtISO(st),sh=st.getHours()+st.getMinutes()/60,eh=en.getHours()+en.getMinutes()/60;if(sh<H0||sh>H1)return;const cell=document.querySelector('.wkc[data-date="'+ds+'"][data-hour="'+Math.floor(sh)+'"]');if(!cell)return;const d=document.createElement('div');d.className='wkev';const top=(sh-Math.floor(sh))*56,dur=Math.max(eh-sh,.5),ht=Math.min(dur*56,(Math.floor(eh)-Math.floor(sh)+1)*56-top);d.style.cssText='top:'+top+'px;height:'+Math.max(ht,18)+'px;background:'+rcol(ev.room, ROOMS)+';';d.textContent=fmtT(ev.start)+' '+ev.title;d.onclick=e=>{e.stopPropagation();showTip(e,ev)};cell.appendChild(d);});
}

function renderToday(){
  const now=new Date(curDate),ds=fmtISO(now);
  const dayEvts=mergeEvts(filtered.filter(e=>(e.start||'').startsWith(ds)).sort((a,b)=>(a.start||'').localeCompare(b.start||'')));
  const dStr=now.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  let h='<div class="today-hd"><h2>'+dStr+'</h2><div class="td-nav"><button onclick="nav(-1)">◀</button><button class="td" onclick="goToday()">Today</button><button onclick="nav(1)">▶</button></div><span class="badge bg-bl">'+dayEvts.length+' bookings</span></div>';
  if(!dayEvts.length){h+='<div style="text-align:center;padding:60px;color:var(--tx3);font-size:1.1rem">No bookings on this day</div>';document.getElementById('mainArea').innerHTML=h;return;}
  const allDay=dayEvts.filter(e=>e.all_day);
  const byHour={};dayEvts.filter(e=>!e.all_day).forEach(ev=>{const hr=ev.start?new Date(ev.start).getHours():0;byHour[hr]=byHour[hr]||[];byHour[hr].push(ev);});
  h+='<div class="timeline">';
  if(allDay.length){h+='<div class="tl-hour"><div class="tl-time">All day</div><div class="tl-slots">';allDay.forEach(ev=>{h+=cardHTML(ev);});h+='</div></div>';}
  // Render the hours that actually have bookings instead of a fixed 7..22 range.
  // That range silently dropped anything starting before 7 a.m. while the badge
  // above it still counted those bookings, so the header and the body disagreed.
  Object.keys(byHour).map(Number).sort((a,b)=>a-b).forEach(hr=>{const evts=byHour[hr];const lb=hr>12?(hr-12)+' PM':hr===12?'12 PM':hr+' AM';h+='<div class="tl-hour"><div class="tl-time">'+lb+'</div><div class="tl-slots">';evts.forEach(ev=>{h+=cardHTML(ev);});h+='</div></div>';});
  h+='</div>';document.getElementById('mainArea').innerHTML=h;
}

// ── CHANGES ──
// Additions and removals between scrapes — the only trace a cancelled booking
// leaves, since the report carries no booking id and a vanished booking simply
// disappears from the window. Cached, because applyFilters() re-renders on
// every keystroke and refetching 200 rows per letter would be silly.
let CHANGES=null;
// What the cached feed is a snapshot of: limit plus the filters it was asked
// for. Empty means nothing is cached for the current filter set.
let CHANGE_KEY='';

// The app fills a year of history by itself on first run, while this page is
// already open on an almost-empty calendar. Watch for that fill ending and
// reload, or the year lands in the database and never appears on screen.
let BF_WAS_RUNNING=false;
function renderChanges(force){
  const el=document.getElementById('mainArea');
  const terms=searchTerms();
  const p=new URLSearchParams({limit:'200'});
  // Only when the room set is a real narrowing. store.get_events documents that
  // an *empty* `rooms` means no restriction, and an all-rooms CSV is that same
  // request spelled out ninety-one times.
  if(activeRooms.size&&activeRooms.size<ROOMS.length)p.set('rooms',[...activeRooms].join(','));
  // One term, not all of them: the endpoint takes a single `q` and LIKEs it.
  // The last is the box's value when the two differ, which is the most recent
  // thing typed.
  if(terms.length)p.set('q',terms[terms.length-1]);
  const key=p.toString();
  // The feed is filtered on the server because /api/changes applies its limit
  // before any client-side filter could: "no changes for room 142" computed
  // here could be a lie about the newest 200 rows. The key is what the memo is
  // good for, so changing a filter refetches.
  if(!force&&CHANGES&&key===CHANGE_KEY){paintChanges();return;}
  if(force||!el.querySelector('#chgList')){
    el.innerHTML='<div class="chead"><h2>Changes</h2>'
      +'<span class="badge bg-bl" id="chgCnt">loading…</span>'
      +'<button class="btn" onclick="renderChanges(true)" title="Fetch the feed again">⟳ Refresh</button></div>'
      +'<div id="chgList"><div class="freeload">loading…</div></div>';
  }
  CHANGE_KEY=key;
  fetch('/api/changes?'+key).then(r=>r.json()).then(d=>{CHANGES=d;paintChanges();})
    .catch(e=>{const l=document.getElementById('chgList');
      if(l)l.innerHTML='<div class="freeload">Could not load changes: '+esc(e.message)+'</div>';});
}

function paintChanges(){
  const list=document.getElementById('chgList');
  if(!list||!CHANGES)return;
  const cnt=document.getElementById('chgCnt');
  if(cnt)cnt.textContent='+'+CHANGES.added+' −'+CHANGES.removed;
  const rows=CHANGES.changes||[];
  if(!rows.length){
    list.innerHTML='<div style="text-align:center;padding:60px;color:var(--tx3);font-size:1.1rem">Nothing has changed since the feed began</div>';
    return;
  }
  const perDay={};
  rows.forEach(c=>{const d=c.date||(c.start||'').slice(0,10);if(d)perDay[d]=(perDay[d]||0)+1;});
  let h='',lastDay='';
  rows.forEach(c=>{
    const d=c.date||(c.start||'').slice(0,10);
    if(d&&d!==lastDay){
      lastDay=d;const n=perDay[d];
      h+='<div class="daysep"><span>'+new Date(d+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</span><span class="dc">'+n+(n===1?' change':' changes')+'</span></div>';
    }
    h+=chgHTML(c);
  });
  list.innerHTML=h;
}

function chgHTML(c){
  const added=c.kind==='added';
  // Same trap cardHTML documents above: an all-day row's start is just
  // midnight, so printing the clock times reads as a real 23-hour booking.
  // The feed carries all_day precisely so this can branch.
  const when=c.all_day?'<span class="mono">All day</span>':(c.start?'<span class="mono">'+fmtT(c.start)+(c.end?' → '+fmtT(c.end):'')+'</span>':'');
  const room=c.room?'Room '+esc(c.room):'';
  const meta=[when,room,c.description?esc(c.description):''].filter(Boolean).join(' · ');
  return '<div class="chg '+(added?'added':'removed')+'">'
    +'<span class="chg-kind">'+(added?'+ Added':'− Removed')+'</span>'
    +'<span class="chg-body"><span class="chg-t">'+esc(c.title||'(untitled)')+'</span>'
    +(meta?'<span class="chg-m">'+meta+'</span>':'')+'</span>'
    +'<span class="chg-when">seen '+esc(fmtSeen(c.detected_at))+'</span>'
    +'</div>';
}

// When we noticed the change — not when the booking is. Short form, because
// most of the feed is from today or yesterday.
function fmtSeen(iso){
  if(!iso)return'';
  const d=new Date(iso);
  const today=new Date();
  const yest=new Date();yest.setDate(today.getDate()-1);
  if(d.toDateString()===today.toDateString())return'today '+d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===yest.toDateString())return'yesterday';
  return d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
}

// There is deliberately no todayNav. It used to step the date and call
// renderToday() directly, which skipped render() — and render() is the only
// caller of syncExportLinks, writeURL and maybeRefreshFree. So stepping a day
// in Today view left the URL and both export links describing the day you had
// just navigated away from, and never re-asked the free-at question. The bug
// was the second render path, so the fix is to have one: every arrow, key and
// view switch lands in nav() or goToday(), and both go through render().
function nav(dir){
  // The feed is a list of changes, not a span of time. Advancing the date here
  // would change nothing on screen while quietly moving the month underneath.
  if(viewMode==='changes')return;
  // One press moves one unit of the view you are looking at: a month in Month,
  // a week in Week, a day in Today. Today used to step a week here while its
  // own arrow buttons stepped a day, so ArrowRight and ▶ disagreed about how
  // far a press went; Week was left out of the rule altogether and stepped a
  // month, so its arrows skipped three weeks of bookings at a time.
  if(viewMode==='today')curDate.setDate(curDate.getDate()+dir);
  else if(viewMode==='week')curDate.setDate(curDate.getDate()+dir*7);
  else stepMonth(dir);
  render();
}
// Step whole months without falling off the end of a short one. setMonth alone
// overflows — 31 January plus one month is 31 February, which rolls forward to
// 3 March — so stepping forward from the 31st skipped February on screen and
// the header read March. Going to the 1st first removes the overflow, and the
// day is then clamped to the target month's length. It is not remembered: step
// from the 31st to February and you are on the 28th, and stepping back lands on
// the 28th of January rather than the 31st. Carrying an anchor day would need a
// fourth piece of state, reset by every URL load and every Today press, to buy
// back a day-of-month that nothing on this page is anchored to.
function stepMonth(dir){
  const day=curDate.getDate();
  curDate.setDate(1);
  curDate.setMonth(curDate.getMonth()+dir);
  const last=new Date(curDate.getFullYear(),curDate.getMonth()+1,0).getDate();
  curDate.setDate(Math.min(day,last));
}
function goToday(){curDate=new Date();render();}

// ── OVERLAYS — day modal and filter panel share the focus machinery ──
// These used to be single-instance, bound to #dayModal: one module-level
// `modalOpener` and one suppression pass. A second overlay would have clobbered
// the first one's focus restore, so both now go through trapFocus/releaseFocus.
const SUPPRESS='.bar a,.bar button,.side button,.side [role="button"],.cday';
let overlayOpener=null;
function trapFocus(modal){
  overlayOpener=document.activeElement;
  modal.classList.add('show');
  // Move focus into the dialog so the keyboard follows the eye, and keep the
  // page behind it from being tabbed into while it is open. Both openers are
  // inside .side, so they are suppressed too — the panel's own controls are not,
  // because the panel sits outside .bar and .side.
  const first=modal.querySelector('.mcl');
  if(first)first.focus();
  document.querySelectorAll(SUPPRESS).forEach(el=>{el.dataset.tab=el.tabIndex;el.tabIndex=-1;});
}
function releaseFocus(modal){
  modal.classList.remove('show');
  document.querySelectorAll('[data-tab]').forEach(el=>{el.tabIndex=Number(el.dataset.tab);delete el.dataset.tab;});
  if(overlayOpener&&overlayOpener.focus)overlayOpener.focus();
  overlayOpener=null;
}
// One closer for Esc, for both ✕ buttons and for a click on either backdrop.
function closeOverlays(){
  document.querySelectorAll('.mover.show').forEach(releaseFocus);
}
function closeModal(){closeOverlays();}

function openDay(ds){
  const dayEvts=mergeEvts(filtered.filter(e=>(e.start||'').startsWith(ds)).sort((a,b)=>(a.start||'').localeCompare(b.start||'')));
  if(!dayEvts.length)return;
  document.getElementById('modalTitle').textContent=new Date(ds+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' — '+dayEvts.length+' bookings';
  document.getElementById('modalBody').innerHTML=dayEvts.map(ev=>cardHTML(ev)).join('');
  trapFocus(document.getElementById('dayModal'));
}
document.querySelectorAll('.mover').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)closeOverlays();}));

// ── FILTER PANEL ──
// Floor, capacity, equipment and free-at need more room than the sidebar has
// left, so they live over the calendar. The panel reuses the overlay machinery
// above and the sidebar's chip classes rather than inventing a second set.
const SEAT_STEPS=[0,10,20,30,40,50,75,100,150,200];
const MINUTE_STEPS=[15,30,45,60,90,120,180];
let PRESETS=[];
// A working copy of the groups while the editor is open. Nothing reaches GROUPS
// — and so nothing reaches the sidebar — until Save groups, so an edit that is
// abandoned by closing the panel leaves the real groups untouched.
let GEDIT={};

function openFilters(){
  GEDIT=Object.fromEntries(Object.entries(GROUPS).map(([k,v])=>[k,[...v]]));
  buildFilterBody();
  trapFocus(document.getElementById('filterModal'));
  // Keyed, so reopening the panel does not refetch a set that is already for
  // the day, time and length on screen — the note is rebuilt from it instead.
  maybeRefreshFree();
  loadPresets();
}

// The floors to offer, taken from the data rather than from FLOOR_ORDER: the
// constant lists twelve floors and the bookings only ever use eleven — there is
// no 5th Floor — so a chip built from it would select nothing and read as a bug.
// ROOMS arrives sorted by (floor, room), so first-seen order is display order
// and FLOOR_ORDER does not need duplicating in the browser.
//
// NO_FLOOR stands for a room whose floor the data does not state. The floor
// filter is a *partition*, so "not on Ground Floor" is the honest reading for
// such a room — unlike capacity, which is a threshold and lenient about an
// unknown (see applyFilters). But the room used to vanish under every floor
// chip with no chip that could select it, which is a state the user could
// neither see nor enter. The sentinel is a label rather than an empty string
// because an empty string does not survive being comma-joined into a URL.
const NO_FLOOR='(no floor)';
function floorOf(room){return (ROOM_META[room]||{}).floor||NO_FLOOR;}

function floorsPresent(){
  const inData=new Set(EVENTS.map(e=>e.room));
  const out=[];
  let unknown=false;
  ROOMS.forEach(r=>{
    if(!inData.has(r))return;
    const f=(ROOM_META[r]||{}).floor;
    if(!f){unknown=true;return;}
    if(!out.includes(f))out.push(f);
  });
  // Last, so the known floors keep their display order and this reads as the
  // remainder rather than as one of them.
  if(unknown)out.push(NO_FLOOR);
  return out;
}
function roomsWithNoFloor(){
  const inData=new Set(EVENTS.map(e=>e.room));
  return ROOMS.filter(r=>inData.has(r)&&!(ROOM_META[r]||{}).floor).length;
}
function roomsWithoutCapacity(){
  const seen=new Set();
  EVENTS.forEach(e=>{
    const m=ROOM_META[e.room];
    if(m&&m.capacity==null)seen.add(e.room);
  });
  return seen.size;
}

function el(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text;
  return e;
}
function sec(title){
  const s=el('div','fsec');
  s.appendChild(el('div','stit',title));
  return s;
}

function buildFilterBody(){
  const body=document.getElementById('filterBody');
  body.innerHTML='';

  // Stated, not silently ignored. A change row describes a booking that was
  // added or removed in the past, so "free at 2pm" and "seats ≥ 20" have
  // nothing to say about it. Rooms and the search box do, and only those reach
  // the feed.
  if(viewMode==='changes'){
    const cw=el('div','fnote');
    cw.textContent='The Changes view reads room and search only. Floor, capacity, '
      +'equipment and free-at describe what a room is like now, and a change row '
      +'is about the past — so they are not applied here.';
    body.appendChild(cw);
  }

  // ── Floor ──
  const fs=sec('Floor');
  const fbar=el('div','gbar');
  const floors=floorsPresent();
  if(!floors.length){fs.appendChild(el('div','fempty','No floors in the current data.'));}
  else{
    floors.forEach(f=>{
      const b=el('button',null,f===NO_FLOOR?'No floor':f);
      b.classList.toggle('on',advFloors.has(f));
      b.setAttribute('aria-pressed',advFloors.has(f)?'true':'false');
      b.onclick=()=>{if(advFloors.has(f))advFloors.delete(f);else advFloors.add(f);buildFilterBody();writeURL();applyFilters();};
      fbar.appendChild(b);
    });
    // "Any floor" belongs in the same row as the floors, the way "All" does in
    // the sidebar's group bar — appended to the section instead it wrapped onto
    // a line of its own and read as a separate control.
    const any=el('button','gb','Any floor');
    any.classList.toggle('on',!advFloors.size);
    any.setAttribute('aria-pressed',advFloors.size?'false':'true');
    any.onclick=()=>{advFloors.clear();buildFilterBody();writeURL();applyFilters();};
    fbar.appendChild(any);
    fs.appendChild(fbar);
    // Stated, not silent, and stated only when there is something to state.
    // The rule is the opposite of the capacity one above, so leaving it
    // unspoken would make the two look like an oversight rather than a choice.
    const nf=roomsWithNoFloor();
    if(nf)fs.appendChild(el('div','fnote',
      nf+' of '+ROOMS.length+' rooms have no recorded floor. Unlike capacity, '
      +'floor is a partition, so they are not on the floor you picked — choose '
      +'"No floor" to see them.'));
  }
  body.appendChild(fs);

  // ── Capacity ──
  const cs=sec('Capacity');
  const crow=el('div','frow');
  crow.appendChild(el('label',null,'Seats ≥'));
  const sel=el('select');
  SEAT_STEPS.forEach(n=>{
    const o=el('option',null,n?'at least '+n:'any size');
    o.value=String(n);o.selected=(n===advSeats);sel.appendChild(o);
  });
  sel.onchange=()=>{advSeats=+sel.value;buildFilterBody();writeURL();applyFilters();};
  crow.appendChild(sel);
  cs.appendChild(crow);
  // Stated, not silent. Almost half the rooms have no recorded capacity, and the
  // rule is that they pass the minimum rather than being hidden by it.
  cs.appendChild(el('div','fnote',
    roomsWithoutCapacity()+' of '+ROOMS.length+' rooms have no recorded capacity. '
    +'They are kept by a minimum rather than hidden — a room that might be too '
    +'small is a better answer than half the building disappearing.'));
  body.appendChild(cs);

  // ── Equipment ──
  const es=sec('Equipment');
  const ebar=el('div','gbar');
  const pb=el('button',null,'🎥 Panopto');
  pb.classList.toggle('on',advPanopto);
  pb.setAttribute('aria-pressed',advPanopto?'true':'false');
  pb.onclick=()=>{advPanopto=!advPanopto;buildFilterBody();writeURL();applyFilters();};
  ebar.appendChild(pb);
  es.appendChild(ebar);
  body.appendChild(es);

  // ── Free at a time ──
  const tms=sec('Free at a time');
  const trow=el('div','frow');
  trow.appendChild(el('label',null,'Free from'));
  const time=el('input');time.type='time';time.value=advFreeAt;
  time.onchange=()=>{advFreeAt=time.value;FREE_KEY='';buildFilterBody();writeURL();loadFreeRooms();};
  trow.appendChild(time);
  trow.appendChild(el('label',null,'for'));
  const mins=el('select');
  MINUTE_STEPS.forEach(n=>{const o=el('option',null,n+' min');o.value=String(n);o.selected=(n===advFreeMins);mins.appendChild(o);});
  mins.onchange=()=>{advFreeMins=+mins.value;FREE_KEY='';buildFilterBody();writeURL();loadFreeRooms();};
  trow.appendChild(mins);
  if(advFreeAt){
    const off=el('button',null,'Turn off');off.className='gb';
    off.onclick=()=>{advFreeAt='';FREE_DAYS=null;FREE_KEY='';buildFilterBody();writeURL();applyFilters();};
    trow.appendChild(off);
  }
  tms.appendChild(trow);
  const fnote=el('div','fnote','');
  fnote.id='freeNote';
  fnote.textContent=freeNoteText();
  tms.appendChild(fnote);
  body.appendChild(tms);

  // ── Groups ──
  const gs=sec('Groups');
  Object.keys(GEDIT).forEach(name=>gs.appendChild(groupEditorRow(name)));
  const addb=el('button',null,'+ Add group');
  addb.className='btn';
  addb.onclick=()=>{
    let n='New group',i=2;
    while(GEDIT[n])n='New group '+(i++);
    GEDIT[n]=[];
    buildFilterBody();
  };
  gs.appendChild(addb);
  const saveb=el('button',null,'Save groups');
  saveb.className='btn btn-a';saveb.style.marginLeft='8px';
  saveb.onclick=saveGroups;
  gs.appendChild(saveb);
  gs.appendChild(el('div','fnote',
    'Saved to data/room_groups.json and shared by both views. Clearing every '
    +'room from a group keeps the group but selects nothing.'));
  body.appendChild(gs);

  // ── Presets ──
  const ps=sec('Saved filters');
  const ptags=el('div','ftags');ptags.id='presetTags';
  ps.appendChild(ptags);
  const prow=el('div','frow');
  const pname=el('input');pname.type='text';pname.placeholder='Name this filter…';pname.id='presetName';
  prow.appendChild(pname);
  const psave=el('button',null,'Save');psave.className='btn';
  psave.onclick=()=>savePreset(pname.value);
  prow.appendChild(psave);
  ps.appendChild(prow);
  ps.appendChild(el('div','fnote',
    'A preset holds the filters only — not the day or the view, which would make '
    +'it useless tomorrow. The link below is the opposite: it does carry the date.'));
  body.appendChild(ps);
  renderPresets();

  // ── Actions ──
  const acts=el('div','facts');
  const copy=el('button',null,'🔗 Copy link');copy.className='btn';
  copy.onclick=()=>copyLink();
  const clear=el('button',null,'Clear all');clear.className='btn';
  clear.onclick=clearAllFilters;
  acts.append(copy,clear);
  body.appendChild(acts);
}

// One group: a name, its rooms, and a delete.
function groupEditorRow(name){
  const row=el('div','fgrp');
  const hd=el('div','fgrp-hd');
  const inp=el('input');inp.type='text';inp.value=name;
  inp.setAttribute('aria-label','Group name');
  // Written straight into the working copy, with no re-render: rebuilding here
  // would take focus out of the field on every keystroke.
  inp.oninput=()=>{const v=inp.value;if(v===name)return;GEDIT[v]=GEDIT[name];delete GEDIT[name];name=v;};
  hd.appendChild(inp);
  const del=el('button','fdel','Delete');
  del.onclick=()=>{delete GEDIT[name];buildFilterBody();};
  hd.appendChild(del);
  row.appendChild(hd);

  const rooms=el('div','fgrp-rooms');
  ROOMS.forEach(r=>{
    const c=el('div','rc');
    // The editor's chips show group membership. They carry .rc for the look,
    // but syncChips is scoped to #rchips so it cannot repaint them.
    c.textContent=r;
    const on=(GEDIT[name]||[]).includes(r);
    c.classList.toggle('on',on);c.classList.toggle('off',!on);
    c.setAttribute('role','button');c.tabIndex=0;
    c.setAttribute('aria-pressed',on?'true':'false');
    c.onclick=()=>{
      const list=GEDIT[name]||(GEDIT[name]=[]);
      const i=list.indexOf(r);
      if(i<0)list.push(r);else list.splice(i,1);
      const now=list.includes(r);
      c.classList.toggle('on',now);c.classList.toggle('off',!now);
      c.setAttribute('aria-pressed',now?'true':'false');
    };
    rooms.appendChild(c);
  });
  row.appendChild(rooms);
  return row;
}

async function saveGroups(){

// ── FREE AT A TIME (server-side) ──
// Asked of /api/today, the same route and the same predicate that answer Free
// Right Now. A JS reimplementation would be a second answer to one question.
let FREE_KEY='';
// The days the current view draws bookings from. A month cell is a whole grid,
// so the first and last cells can fall in the neighbouring month — asking for
// the grid is simpler than trimming it, and 42 days is well inside the
// server's cap of 62.
function viewDays(){
  if(viewMode==='changes')return [];
  if(viewMode==='month'){
    const y=curDate.getFullYear(),m=curDate.getMonth();
    const first=new Date(y,m,1),last=new Date(y,m+1,0);
    const total=Math.ceil((first.getDay()+last.getDate())/7)*7;
    const start=new Date(y,m,1-first.getDay()),out=[];
    for(let i=0;i<total;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);out.push(fmtISO(d));
    }
    return out;
  }
  if(viewMode==='week'){
    const sow=new Date(curDate);sow.setDate(curDate.getDate()-curDate.getDay());
    const out=[];
    for(let i=0;i<7;i++){
      const d=new Date(sow);d.setDate(sow.getDate()+i);out.push(fmtISO(d));
    }
    return out;
  }
  return [fmtISO(curDate)];
}
// The key is what the held set is an answer to, and it names the whole span on
// screen — not one day. The note is rebuilt from it whenever the panel is
// redrawn, so reopening the panel does not refetch a set that is already
// current.
function freeKey(){
  const d=viewDays();
  return d.length?d[0]+'|'+d[d.length-1]+'|'+advFreeAt+'|'+advFreeMins:'';
}
// Which day a booking belongs to, for looking it up in the per-day answer.
// The server buckets on the row's own `date` (falling back to the start
// timestamp, the same way avail._span derives it), so this has to agree with
// that or the client would look up a day the server never answered about.
function dayKey(e){return e.date||(e.start||'').slice(0,10);}
function freeOn(e){
  const set=FREE_DAYS&&FREE_DAYS.get(dayKey(e));
  return !!(set&&set.has(e.room));
}
function freeNoteText(){
  if(!advFreeAt)return 'Off. Checked against the day on screen, not today.';
  if(!FREE_DAYS||FREE_KEY!==freeKey())return 'checking…';
  const days=viewDays();
  if(days.length<=1){
    const set=FREE_DAYS.get(days[0])||new Set();
    return set.size+' of '+ROOMS.length+' rooms free from '
      +advFreeAt+' for '+advFreeMins+' min on '+days[0];
  }
  // Across a span, the honest single number is the rooms free on *every* day
  // of it. The old note reported one day's count, which was true of that day
  // and false of the rest of the month it was being applied to.
  let every=null;
  days.forEach(d=>{
    const set=FREE_DAYS.get(d)||new Set();
    every=every===null?new Set(set):new Set([...every].filter(r=>set.has(r)));
  });
  return (every?every.size:0)+' of '+ROOMS.length+' rooms free from '+advFreeAt
    +' for '+advFreeMins+' min on every day shown — each booking is checked'
    +' against its own day';
}
// Looked up on every write, not captured once. The panel body is rebuilt
// whenever it opens, so #freeNote is a different element before and after —
// and a request that starts with the panel closed (a shared link carrying
// ?free=) would otherwise write its answer into a detached node and leave the
// panel showing "checking…" for good.
function setFreeNote(text){
  const note=document.getElementById('freeNote');
  if(note)note.textContent=text;
}
function maybeRefreshFree(){
  if(!advFreeAt)return;
  // The change feed is not a span of time, so there is no day to ask about.
  // Cleared rather than left holding the last answer, which would be an answer
  // to a question this view never asked.
  if(!viewDays().length){FREE_DAYS=null;FREE_KEY='';return;}
  const key=freeKey();
  if(key===FREE_KEY)return;
  FREE_KEY=key;
  loadFreeRooms();
}
async function loadFreeRooms(){
  if(!advFreeAt){FREE_DAYS=null;applyFilters();return;}
  const days=viewDays();
  if(!days.length){FREE_DAYS=null;applyFilters();return;}
  setFreeNote('checking…');
  try{
    // One request for the whole span. Asking per visible day would work and
    // would be 42 round trips, each a full read of the events table.
    const d=await (await fetch('/api/today?dates='+days.join(',')
      +'&at='+encodeURIComponent(advFreeAt)+'&for='+advFreeMins)).json();
    const m=new Map();
    Object.keys(d.days||{}).forEach(k=>m.set(k,new Set((d.days[k].free||[]))));
    FREE_DAYS=m;
    setFreeNote(freeNoteText());
  }catch(e){
    // Left as no-opinion rather than empty: a failed request must not read as
    // "no room is free". FREE_KEY deliberately keeps the key it was set to —
    // clearing it here would make the render() this call ends with see a
    // changed key, refetch immediately, fail again, and spin. A failed check
    // is retried when the day, time or length changes, not on every paint.
    FREE_DAYS=null;
    setFreeNote('Could not check availability: '+e.message);
  }
  applyFilters();
}

function currentFilters(){

// Takes the whole preset rather than its filters object: the toast below used
// to read f.name off the filters, which have no name, so every application
// announced Applied "undefined".
function applyPreset(p){
  const f=parseFilters((p&&p.filters)||{},{rooms:ROOMS,groups:GROUPS});
  // No room list means every room, not none. An empty set here is what blanked
  // the calendar for a preset that simply had not recorded any rooms.
  activeRooms=new Set(f.rooms||ROOMS);
  activeGroups=new Set(f.groups||[]);
  searchQ=f.q;
  document.getElementById('q').value=f.q;
  advFloors=new Set(f.floors||[]);
  advSeats=f.seats;
  advPanopto=f.panopto;
  advFreeAt=f.free;
  advFreeMins=f.mins;
  // Clearing the key alone would leave the previous set in place and apply it
  // to the new filters for as long as the refetch took.
  FREE_KEY='';FREE_DAYS=null;
  syncGroupBtns();syncChips();renderTags();buildFilterBody();applyFilters();
  toast('Applied “'+((p&&p.name)||'filter')+'”',true);
}
async function savePreset(rawName){

// ── URL STATE ──
// replaceState, not pushState: with push, every chip click becomes a
// back-button step and leaving the page takes a dozen presses. The cost is that
// Back does not undo a filter — Clear all is the escape hatch for that.
// The coercion rules both readers share live in parseFilters, in /filters.js.

function writeURL(){
  const p=new URLSearchParams();
  // The rooms/q/from/to vocabulary is the one the download endpoints already
  // read, so a copied link works against them too.
  if(activeRooms.size&&activeRooms.size<ROOMS.length)p.set('rooms',[...activeRooms].join(','));
  if(searchQ)p.set('q',searchQ);
  if(activeGroups.size)p.set('groups',[...activeGroups].join(','));
  if(advFloors.size)p.set('floors',[...advFloors].join(','));
  if(advSeats)p.set('seats',advSeats);
  if(advPanopto)p.set('panopto','1');
  if(advFreeAt){p.set('free',advFreeAt);p.set('mins',advFreeMins);}
  p.set('view',viewMode);
  p.set('date',fmtISO(curDate));
  const qs=p.toString();
  history.replaceState(null,'',qs?'?'+qs:location.pathname);
}
// Read once at the end of boot(), after activeRooms and the Classroom union
// have been set up and before the first applyFilters().
function readURL(){
  const p=new URLSearchParams(location.search);
  const f=parseFilters(Object.fromEntries(p),{rooms:ROOMS,groups:GROUPS});
  if(f.groups)activeGroups=new Set(f.groups);
  // An explicit room list is the more specific statement, so it wins; with only
  // groups named, the selection implies its rooms — the same inference
  // toggleGroup makes, through the same helper.
  if(f.rooms)activeRooms=new Set(f.rooms);
  else if(activeGroups.size)activeRooms=roomsForGroups();
  if(f.q){searchQ=f.q.toLowerCase();document.getElementById('q').value=f.q;}
  if(f.floors)advFloors=new Set(f.floors);
  advSeats=f.seats;
  advPanopto=f.panopto;
  advFreeAt=f.free;
  advFreeMins=f.mins;
  const v=p.get('view');
  if(v&&['today','week','month','changes'].includes(v))viewMode=v;
  const d=p.get('date');
  // Noon, so the local-date round-trip through fmtISO cannot slip a day — the
  // same reason fmtDay appends T12:00:00.
  if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d))curDate=new Date(d+'T12:00:00');
  document.querySelectorAll('.vtab').forEach(b=>b.classList.remove('on'));
  const tab=document.getElementById('v-'+viewMode);
  if(tab)tab.classList.add('on');
  syncGroupBtns();syncChips();renderTags();
  return p.toString().length>0;
}
