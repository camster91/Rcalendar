<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotman Room Bookings — List</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--sf:#fff;--sf2:#f0f3f8;--sf3:#e4e9f0;--bd:#dce2ea;--bd2:#bfc8d4;--tx:#1a2133;--tx2:#4a5568;--tx3:#617082;--ac:#0d64f4;--ac2:#1e6ef5;--acg:#eff6ff;--gn:#0b7e58;--gn2:#04865e;--rd:#dc1313;--og:#a46907;--r:12px;--rs:8px;--sh:0 1px 3px rgba(0,0,0,.06);--sh2:0 8px 24px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
/* The calendar's rule, which this page did not have. It matters for the same
   reason it matters there: this page has had a span carrying an onclick, and
   anything that is not a real button gets no focus ring from the browser at
   all. Every interactive element here is a button, link, input or select now,
   so this is the app's ring rather than the browser's default -- which is the
   point, so the two pages look the same when you tab through them. */
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
.bar{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.bar-l{display:flex;align-items:center;gap:12px}
.logo{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.bar-r{display:flex;align-items:center;gap:8px}
.tab{padding:6px 14px;border-radius:6px;font-size:.88rem;font-weight:500;color:var(--tx2);cursor:pointer;border:none;background:none;text-decoration:none;transition:.15s}
.tab:hover{color:var(--tx)}.tab.on{background:var(--ac);color:#fff}
.badge{padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:600}
.bg-gn{background:rgba(16,185,129,.1);color:var(--gn2)}.bg-bl{background:var(--acg);color:var(--ac)}.bg-gr{background:var(--sf2);color:var(--tx2)}
.bg-rd{background:rgba(220,19,19,.09);color:var(--rd)}.bg-og{background:rgba(164,105,7,.1);color:var(--og)}
.btn{padding:7px 14px;border-radius:var(--rs);font-size:.88rem;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);display:inline-flex;align-items:center;gap:5px;transition:.15s;text-decoration:none}
.btn:hover{background:var(--sf2);color:var(--tx)}.btn-g{background:var(--gn2);border-color:var(--gn2);color:#fff}

.container{max-width:1100px;margin:0 auto;padding:20px 28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:4px;font-weight:600}
.stat-v{font-size:1.5rem;font-weight:800;font-family:'JetBrains Mono',monospace}
.sv-ac{color:var(--ac)}.sv-gn{color:var(--gn2)}.sv-og{color:var(--og)}

/* Search + Groups */
.ctrls{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sbox{position:relative;width:280px;flex-shrink:0}
.sbox input{width:100%;padding:9px 14px 9px 36px;border-radius:var(--r);background:var(--sf);border:1px solid var(--bd);color:var(--tx);font-size:.92rem;outline:none;box-shadow:var(--sh)}
.sbox input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
/* outline:none above and on .fsel is only safe with a replacement ring. The
   input had one; the room select did not, so the one control on this page you
   reach with Tab and change with the arrow keys was the one with no visible
   focus. Same ring, so the two read as the same kind of control. */
select.fsel:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.sbox .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:.92rem}
.sdrop{position:absolute;top:100%;left:0;right:0;background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rs);box-shadow:var(--sh2);z-index:50;max-height:280px;overflow-y:auto;display:none;margin-top:2px}
.sdrop.show{display:block}
.sdrop-section{padding:6px 10px 3px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3)}
/* width/background/border/font/text-align are for the button element these are
   built as -- see calendar.html. */
.sdrop-item{padding:7px 10px;font-size:.88rem;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--tx2);width:100%;background:none;border:none;font-family:inherit;text-align:left}
.sdrop-item:hover{background:var(--sf2);color:var(--tx)}
.rm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:500;display:flex;align-items:center;gap:4px}
.tag-rm{background:var(--acg);color:var(--ac);border:1px solid rgba(59,130,246,.2)}
.tag-grp{background:rgba(245,158,11,.08);color:var(--og);border:1px solid rgba(245,158,11,.2)}
.tag-q{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}
.tag-x{cursor:pointer;opacity:.6;font-size:.78rem;margin-left:2px;background:none;border:none;padding:0;color:inherit;font-family:inherit;line-height:1}.tag-x:hover{opacity:1}

.gbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.gb{padding:5px 12px;border-radius:5px;font-size:.82rem;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);transition:.12s;user-select:none}
.gb:hover{color:var(--tx);background:var(--sf2)}.gb.on{background:var(--ac);border-color:var(--ac);color:#fff}

.sort-btn{padding:7px 12px;border-radius:var(--rs);background:var(--sf);border:1px solid var(--bd);color:var(--tx2);font-size:.85rem;cursor:pointer;font-weight:500;box-shadow:var(--sh)}
.sort-btn:hover{background:var(--sf2);color:var(--tx)}.sort-btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
select.fsel{padding:7px 12px;border-radius:var(--rs);background:var(--sf);border:1px solid var(--bd);color:var(--tx);font-size:.85rem;outline:none;box-shadow:var(--sh)}

.daysep{padding:12px 18px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);font-weight:700;font-size:.92rem;color:var(--tx);display:flex;align-items:center;gap:10px;margin-top:16px;margin-bottom:6px;box-shadow:var(--sh)}
.daysep:first-child{margin-top:0}
.daysep .dc{font-size:.78rem;color:var(--tx3);font-weight:500}

/* Copyable event cards */
.evcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:14px 18px;margin-bottom:8px;user-select:text;transition:.1s;border-left:4px solid var(--ac);position:relative}
.evcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.05)}
.evcard .etitle{font-weight:600;font-size:.98rem;color:var(--tx);margin-bottom:4px;word-break:break-word;padding-right:28px}
.evcard .etime{font-family:'JetBrains Mono',monospace;font-size:.88rem;color:var(--ac);margin-bottom:3px;white-space:nowrap}
.evcard .eroom{font-size:.88rem;color:var(--tx2);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.evcard .eroom .rd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.evcard .edesc{font-size:.85rem;color:var(--tx3);margin-top:5px;line-height:1.4;word-break:break-word}
/* A real button, as on the calendar: see the note there. */
.evcard .ecopy{position:absolute;top:10px;right:10px;cursor:pointer;font-size:.88rem;color:var(--tx3);opacity:0;transition:.15s;padding:4px 8px;border-radius:4px;background:var(--sf2);border:0;font-family:inherit;line-height:inherit}
.evcard:hover .ecopy{opacity:.6}.evcard .ecopy:hover{opacity:1!important}
.evcard:focus-within .ecopy,.evcard .ecopy:focus-visible{opacity:1}

.pgn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px}
.pb{padding:7px 12px;border-radius:var(--rs);background:var(--sf);border:1px solid var(--bd);color:var(--tx2);font-size:.82rem;cursor:pointer}
.pb:hover{background:var(--sf2);border-color:var(--bd2)}.pb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pb:disabled{opacity:.3;cursor:default}
.empty{padding:60px 20px;text-align:center;color:var(--tx3)}

@media(max-width:768px){.container{padding:14px}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-l">
    <div class="logo">📋 Rotman Room Bookings</div>
    <!-- Bound to /api/status by loadStatus(). This was the hardcoded string
         "● Live", so the list asserted a live session for as long as the page
         was open — including after the session expired and the bookings
         underneath had stopped updating. The calendar's badge reads the real
         state; this one now does too, and it opens neutral rather than green so
         the first frame does not claim anything the page has not checked. -->
    <span class="badge bg-gr" id="sessBadge" title="Checking…">● Session …</span>
    <!-- An update offer, when there is one. A badge of words only: this page
         owns no install action — the calendar does, and the calendar's
         sidebar is where the offer is accepted or skipped. Saying it here
         too is because this page is a tab of the same app and can otherwise
         be the one that never mentions it. -->
    <span class="badge bg-og" id="updNote" style="display:none"></span>
    <span class="badge bg-gr" id="evcnt">— events</span>
  </div>
  <div class="bar-r">
    <a class="tab" id="tab-cal" href="/">📅 Calendar</a>
    <a class="tab on" href="/list">📋 List</a>
  </div>
</div>

<div class="container">
  <div class="stats" id="stats"></div>
  <div class="ctrls">
    <div class="sbox">
      <span class="si">🔍</span>
      <input type="text" id="search" placeholder="Search rooms, events..." aria-label="Search bookings by room, group or event" autocomplete="off" oninput="onSearch()" onfocus="onSearch()" onblur="dropBlur()">
      <div class="sdrop" id="sdrop"></div>
      <div class="tags" id="tags"></div>
    </div>
  </div>
  <!-- Built from GROUPS by buildGroupBtns(). Hardcoded buttons meant a group
       added in the config never appeared here, and the page showed a different
       set of groups from the calendar. -->
  <div class="gbar" id="gbar"></div>
  <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <button class="sort-btn on" onclick="setSort('time')" id="s-time" aria-pressed="true">⏰ Time</button>
    <button class="sort-btn" onclick="setSort('room')" id="s-room" aria-pressed="false">🏠 Room</button>
    <button class="sort-btn" onclick="setSort('title')" id="s-title" aria-pressed="false">📝 Title</button>
    <select class="fsel" id="roomFilter" aria-label="Filter by room" onchange="onRoomSelect(this.value)"><option value="all">All Rooms</option></select>
  </div>
  <div id="list"></div>
  <div class="pgn" id="pgn"></div>
</div>

<script src="/filters.js"></script>
<script>
// Populated from /api/bootstrap on startup.
let EVENTS=[],ROOMS=[],GROUPS={};
// The scrape timestamp of the EVENTS this page is holding, so loadStatus
// can tell a scrape that landed behind this window from a clock tick.
// null before the first reading, which is adopted rather than acted on —
// the boot fetch is, or is within a breath of, the same scrape.
let EVENTS_SCRAPE=null;

// The single source of truth for what is selected. This page used to keep the
// selection twice -- a `tags` array pushed to imperatively, and activeGroups --
// and that duplication is where the bugs came from: the room <select> and the
// room tags were two filters that ANDed, so choosing a room in the dropdown and
// then adding the same room as a tag selected nothing at all. tags is now a
// *view* of this state, rebuilt by renderTags(), exactly as on the calendar.
// Every room once boot has ROOMS — "all" is the full set, as on the calendar,
// and a group is shorthand for its rooms (see toggleGroup).
let activeRooms=new Set();
let activeGroups=new Set();
let searchQ='';

let sortKey='time',page=0,PER=50;

// Generated rather than hardcoded, so a group added in the config appears here
// without a code change. Built with DOM calls, not an html string: a group name
// is user-controlled once the editor ships, and concatenating one into markup
// or into an onclick attribute lets a quote in the name break out of it.
function buildGroupBtns(){
  const bar=document.getElementById('gbar');
  bar.innerHTML='';
  const add=(label,g)=>{
    const b=document.createElement('button');
    b.className='gb';b.dataset.g=g;b.textContent=label;
    b.onclick=()=>toggleGroup(g);
    bar.appendChild(b);
  };
  add('All','');
  Object.keys(GROUPS).forEach(g=>add(g==='Classroom'?'🏫 '+g:g,g));
  syncGroupBtns();
}

function buildRoomFilter(){
  const rCnt={};EVENTS.forEach(e=>{rCnt[e.room]=(rCnt[e.room]||0)+1;});
  const sel=document.getElementById('roomFilter');
  sel.length=1;   // keep the "All Rooms" option, drop any previous rooms
  Object.keys(rCnt).sort().forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r+' ('+rCnt[r]+')';sel.appendChild(o);});
  syncRoomSelect();
}

// Called from boot() once EVENTS is populated. This used to be an IIFE that
// ran at parse time, before the fetch had resolved, so every tile read 0 and
// was never recomputed.
function renderStats(){
  const ur=new Set(EVENTS.map(e=>e.room)),days=new Set(EVENTS.map(e=>(e.start||'').slice(0,10)));
  const hrs=EVENTS.reduce((a,e)=>{if(e.start&&e.end)return a+(new Date(e.end)-new Date(e.start))/36e5;return a;},0);
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="stat-l">Events</div><div class="stat-v sv-ac">'+EVENTS.length+'</div></div>'+
    '<div class="stat"><div class="stat-l">Rooms</div><div class="stat-v sv-gn">'+ur.size+'</div></div>'+
    '<div class="stat"><div class="stat-l">Hours</div><div class="stat-v sv-og">'+hrs.toFixed(0)+'</div></div>'+
    '<div class="stat"><div class="stat-l">Days</div><div class="stat-v">'+days.size+'</div></div>';
}

// esc, fmtT, fmtDur, fmtDay and mergeEvts are in /filters.js, shared with the
// calendar. This page's copies had drifted: its fmtDay had no full-timestamp
// guard, so copyCard put "Invalid Date" on the clipboard, and it returned '?'
// and '—' where the calendar returned ''. Declaring any of them here as well is
// a parse-time error, not an override.

function copyCard(ev){const rooms=ev.rooms||[ev.room];const txt=(ev.title||'')+(ev.booked_by?' — '+ev.booked_by:'')+'\n'+fmtDay(ev.start)+', '+fmtT(ev.start)+(ev.end?' → '+fmtT(ev.end):'')+'\n'+(rooms.length>1?'Rooms ':'Room ')+rooms.join(', ')+(ev.description?' • '+ev.description:'');navigator.clipboard.writeText(txt).catch(()=>{});}

function cardHTML(ev){const c=rcol(ev.rooms?ev.rooms[0]:ev.room, ROOMS);const bc=ev.rooms&&ev.rooms.length>1?'var(--og)':c;
  // An all-day block has no meaningful clock time — its start is just midnight.
  // Without this branch it printed "12:00 a.m. → 11:00 p.m. (23h)", which reads
  // as a real 23-hour booking.
  const when=ev.all_day?'<em>All day</em>':fmtT(ev.start)+(ev.end?' → '+fmtT(ev.end):'')+(fmtDur(ev.start,ev.end)?' <span style="color:var(--tx3);font-size:.78rem">('+fmtDur(ev.start,ev.end)+')</span>':'');
  return '<div class="evcard'+(ev.all_day?' allday':'')+'" style="border-left-color:'+bc+'"><button type="button" class="ecopy" data-ev="'+evAttr(ev)+'" title="Copy" aria-label="Copy booking">📋</button><div class="etitle">'+titleHTML(ev)+'</div><div class="etime">'+when+'</div><div class="eroom">'+(ev.rooms||[ev.room]).map(r=>'<span class="rd" style="background:'+rcol(r, ROOMS)+'"></span>'+esc(r)).join(' ')+'</div>'+(ev.description?'<div class="edesc">'+esc(ev.description)+'</div>':'')+'</div>';}

// The same delegate as the calendar's, for the same reason: what the copy
// button carries is data, and an onclick attribute is where data stops being
// data. See evAttr in /filters.js.
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.ecopy');
  if(!b)return;
  const ev=evFromAttr(b.dataset.ev);
  if(ev)copyCard(ev);
});

// ── SELECTION ──
// The calendar's model, one rule for both pages: a group is shorthand for its
// rooms, expanded into activeRooms when it is picked, and several groups OR.
// This page used to treat a group as a filter of its own ANDed with the room
// selection, which meant a second meaning for every link naming both — and
// special cases in readURL and writeURL to paper over it. With one model the
// link is just the state, and it lands the same way on either page.
function toggleGroup(g){
  if(!g){activeGroups.clear();activeRooms=new Set(ROOMS);}
  else{
    if(activeGroups.has(g))activeGroups.delete(g);else activeGroups.add(g);
    // No groups left means every room, as on the calendar: an empty
    // selection would be a blank list with no way back.
    activeRooms=activeGroups.size?groupRooms(activeGroups,GROUPS,ROOMS):new Set(ROOMS);
  }
  commitFilterChange();
}
// One exit for every filter change, as on the calendar: change the state, then
// call this. The controls are synced from the state and the list goes back to
// its first page, because a narrower filter can leave the old page empty.
function commitFilterChange(){
  syncGroupBtns();syncRoomSelect();renderTags();page=0;render();
}
function syncGroupBtns(){
  document.querySelectorAll('#gbar .gb').forEach(b=>{
    const g=b.dataset.g;
    const on=!g?activeGroups.size===0:activeGroups.has(g);
    b.classList.toggle('on',on);
    // Both pages' group buttons carry this; a selected group signalled by
    // colour alone is the one thing .on cannot say to anything that is not
    // looking at the colour.
    b.setAttribute('aria-pressed',on?'true':'false');
  });
}

// One room filter, written from two places. The <select> and the search tags
// are the same selection, so each writes activeRooms and reads it back.
function onRoomSelect(v){
  // The label shown when more than one room is selected. Choosing it is not a
  // change, so it must not clear the selection it describes.
  if(v==='__multi__')return;
  // "All rooms" with groups active means the groups' rooms — the calendar's
  // clear does the same — rather than silently dropping the groups' effect.
  activeRooms=v!=='all'?nextRooms(activeRooms,v,'only',ROOMS)
    :activeGroups.size?groupRooms(activeGroups,GROUPS,ROOMS):new Set(ROOMS);
  commitFilterChange();
}
function syncRoomSelect(){
  const sel=document.getElementById('roomFilter');
  let multi=sel.querySelector('option[data-multi]');
  // Every room selected is "All rooms", not "N rooms".
  const n=activeRooms.size>=ROOMS.length?0:activeRooms.size;
  if(n>1){
    if(!multi){multi=document.createElement('option');multi.dataset.multi='1';sel.appendChild(multi);}
    multi.value='__multi__';
    multi.textContent=n+' rooms';
  }else if(multi){multi.remove();}
  // Never shows a room that is not the whole selection: with two rooms picked
  // it says so instead of naming one of them.
  sel.value=n===1?[...activeRooms][0]:(n>1?'__multi__':'all');
}

// Search
let debounce;
// A new term goes back to the first page, as every other filter change does
// (commitFilterChange): page 7 of the old search can be past the end of the
// new one. Only a change, because focusing the box runs this too.
// acSeq: only the newest request draws the list, and a failed one closes it
// rather than throwing in showDrop. See the calendar's onSearch.
let acSeq=0;
function onSearch(){clearTimeout(debounce);debounce=setTimeout(()=>{const v=document.getElementById('search').value.trim();const q=v.toLowerCase();const n=++acSeq;if(q!==searchQ){searchQ=q;page=0;renderTags();}if(v.length<1){closeDrop();render();return;}fetch('/api/autocomplete?q='+encodeURIComponent(v)).then(r=>{keyed(r);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(d=>{if(n===acSeq)showDrop(d);}).catch(()=>{if(n===acSeq)closeDrop();});render();},200);}
function showDrop(d){
  const box=document.getElementById('sdrop');
  box.innerHTML='';
  const section=t=>{const h=document.createElement('div');h.className='sdrop-section';h.textContent=t;box.appendChild(h);};
  const item=(type,value,dot)=>{
    // A button, not a div carrying an onmousedown -- see the same fix and the
    // same reasoning in calendar.html. Typing opens this list, so a keyboard
    // user reaches it and must be able to act on what it shows.
    const el=document.createElement('button');
    el.type='button';
    el.className='sdrop-item';
    if(dot){const s=document.createElement('span');s.className='rm-dot';s.style.background=rcol(value, ROOMS);el.appendChild(s);}
    const s=document.createElement('span');s.textContent=value;
    el.appendChild(s);
    el.onmousedown=()=>addTag(type,value);
    el.onclick=e=>{if(e.detail===0)addTag(type,value);};
    box.appendChild(el);
  };
  if(d.groups.length){section('Groups');d.groups.forEach(g=>item('group',g));}
  if(d.rooms.length){section('Rooms');d.rooms.forEach(r=>item('room',r,true));}
  if(d.titles.length){section('Events');d.titles.forEach(t=>item('query',t));}
  box.classList.add('show');
}
// Bumps acSeq so an answer still in flight cannot reopen a list that was shut.
function closeDrop(){acSeq++;document.getElementById('sdrop').classList.remove('show');}
// The blur close fires only when focus has left both the box and the list.
// Tab moves focus into the list's buttons, and an unconditional timer closed
// the list under that keypress. The delay stays for the mouse's sake: a
// press on an item blurs the box first, and closing immediately would race
// the mousedown the pick rides on.
function dropBlur(){
  setTimeout(()=>{
    const a=document.activeElement;
    if(a&&(a.id==='search'||(a.closest&&a.closest('#sdrop'))))return;
    closeDrop();
  },200);
}
function addTag(type,value){
  if(type==='group'){if(!activeGroups.has(value))toggleGroup(value);return;}
  if(type==='query'){searchQ=value.toLowerCase();document.getElementById('search').value=value;}
  // A room suggestion is picked by the calendar's rule (filters.js
  // nextRooms): with every room on it narrows, otherwise it adds. The search
  // text is left alone, as on the calendar — it is a filter of its own, shown
  // as its own tag, and a pick is not a reason to drop it.
  else{activeRooms=nextRooms(activeRooms,value,'pick',ROOMS);allRoomsDropsGroups();}
  closeDrop();commitFilterChange();
}
function removeTag(type,value){
  if(type==='group'){toggleGroup(value);return;}
  if(type==='room'){activeRooms=nextRooms(activeRooms,value,'remove',ROOMS);allRoomsDropsGroups();}
  else{document.getElementById('search').value='';searchQ='';}
  commitFilterChange();
}
// A room path that lands on every room has undone the group too, as on the
// calendar. Left lit, the group was a state writeURL cannot say: groups= with
// no rooms=, which the reload and the Calendar tab narrowed back to.
function allRoomsDropsGroups(){if(activeRooms.size>=ROOMS.length)activeGroups.clear();}
// A view of the selection, rebuilt from it — never the store. Built as DOM
// nodes with listeners rather than interpolated markup: a group name or an
// event title is user-controlled, and concatenating one into an onclick
// attribute lets a quote in it break out of the string.
function renderTags(){
  const box=document.getElementById('tags');
  box.innerHTML='';
  const add=(cls,label,onX)=>{
    const t=document.createElement('span');
    t.className='tag '+cls;
    t.appendChild(document.createTextNode(label));
    const x=document.createElement('button');
    // A button, not a span with a click handler. As a span this was the one
    // control on the page that a keyboard could not reach and a screen reader
    // was not told about -- the tag could be added without a mouse and only
    // removed with one. The class carries the styling; the button element's own
    // chrome is reset next to it.
    x.className='tag-x';x.type='button';
    x.textContent='✕';
    x.setAttribute('aria-label','Remove filter: '+label);
    x.onclick=onX;
    t.appendChild(x);
    box.appendChild(t);
  };
  if(activeRooms.size&&activeRooms.size<ROOMS.length)
    [...activeRooms].forEach(r=>add('tag-rm','Room '+r,()=>removeTag('room',r)));
  [...activeGroups].forEach(g=>add('tag-grp','📁 '+g,()=>removeTag('group',g)));
  if(searchQ)add('tag-q',searchQ,()=>removeTag('query',searchQ));
}

function setSort(k){sortKey=k;page=0;document.querySelectorAll('.sort-btn').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false')});const on=document.getElementById('s-'+k);on.classList.add('on');on.setAttribute('aria-pressed','true');render();}

// Sorted once, not per render: render() runs on every filter change, and
// filtering preserves order, so the sorted array is reused until the sort
// key or the fetched data (a new EVENTS array, by reference) changes. 'time'
// is an ISO instant, so it compares as a plain string; room and title are
// words, and the one Collator does what localeCompare did — without a fresh
// collator being built for every one of ~29k comparisons.
const COL=new Intl.Collator();
let sortedByKey={src:null,key:'',evts:[]};
function sortedEvents(){
  if(sortedByKey.src!==EVENTS||sortedByKey.key!==sortKey){
    const cmp=sortKey==='time'
      ?(a,b)=>(a.start||'')<(b.start||'')?-1:(a.start||'')>(b.start||'')?1:0
      :sortKey==='room'
        ?(a,b)=>COL.compare(a.room||'',b.room||'')
        :(a,b)=>COL.compare(a.title||'',b.title||'');
    sortedByKey={src:EVENTS,key:sortKey,evts:[...EVENTS].sort(cmp)};
  }
  return sortedByKey.evts;
}

function render(){
  // The URL and the links out hang off render() for the same reason they do on
  // the calendar: everything that changes a filter ends here, so this is the one
  // place that sees every change.
  writeURL();
  const terms=searchQ?[searchQ]:[];
  // The filter runs over the pre-sorted array — filter preserves order, so
  // the result is already in the sort the headers promise.
  let evts=sortedEvents().filter(e=>{
    // The room selection and the search box AND. Groups are already in the
    // room selection (see toggleGroup), so they need no test of their own.
    if(!activeRooms.has(e.room))return false;
    if(terms.length&&!terms.some(s=>((e.title||'')+(e.booked_by||'')+e.room+(e.description||'')).toLowerCase().includes(s)))return false;
    return true;
  });
  document.getElementById('evcnt').textContent=evts.length+' events';
  // Merged before it is paged, not after: paging raw rows split one class
  // held in three rooms across two pages as two cards, and a page held fewer
  // than PER cards whenever rows merged. #evcnt still counts bookings.
  const all=mergeEvts(evts);
  const tp=Math.ceil(all.length/PER);if(page>=tp)page=Math.max(0,tp-1);
  const merged=all.slice(page*PER,(page+1)*PER);
  const listEl=document.getElementById('list');
  if(!evts.length){listEl.innerHTML='<div class="empty" style="font-size:1.1rem">📭 No events match your filters</div>';document.getElementById('pgn').innerHTML='';return;}
  let html='',lastDay='';
  if(sortKey==='time'){
    // One pass, so each day heading lands directly above that day's cards.
    // This was two passes over the same page — every separator first, then
    // every card — which stacked all the headings at the top of the list,
    // decoupled from the bookings they name.
    // Counted over every page, so a day that runs onto the next page is not
    // headed with only the part of it this page holds.
    const dc={};
    all.forEach(ev=>{const d=(ev.start||'').slice(0,10);if(d)dc[d]=(dc[d]||0)+1;});
    merged.forEach(ev=>{
      const d=(ev.start||'').slice(0,10);
      if(d&&d!==lastDay){
        lastDay=d;
        const n=dc[d];
        html+='<div class="daysep"><span>'+new Date(d+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</span><span class="dc">'+n+(n===1?' event':' events')+'</span></div>';
      }
      html+=cardHTML(ev);
    });
  }else{
    merged.forEach(ev=>{html+=cardHTML(ev);});
  }
  listEl.innerHTML=html;
  if(tp>1){let pg='<button class="pb" onclick="page--;render()" aria-label="Previous page"'+(page===0?' disabled':'')+'>◀</button>';const ms=5;let ps=Math.max(0,page-2),pe2=Math.min(tp,ps+ms);if(pe2-ps<ms)ps=Math.max(0,pe2-ms);for(let i=ps;i<pe2;i++)pg+='<button class="pb'+(i===page?' on':'')+'" onclick="page='+i+';render()"'+(i===page?' aria-current="page"':'')+'>'+(i+1)+'</button>';pg+='<button class="pb" onclick="page++;render()" aria-label="Next page"'+(page>=tp-1?' disabled':'')+'>▶</button>';pg+='<span style="font-size:.78rem;color:var(--tx3);margin-left:8px">'+evts.length+' events</span>';document.getElementById('pgn').innerHTML=pg;}else{document.getElementById('pgn').innerHTML='';}
}

document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT')return;if(e.key==='/'){e.preventDefault();document.getElementById('search').focus();}});

// ── URL STATE ──
// A link copied out of the calendar should land here the same way, so this page
// read the same rooms / q / groups parameters — but only read them: there was
// no writeURL at all, so the URL never changed as you filtered and the link to
// the calendar dropped everything you had selected. Both directions work now.
// Only those three parameters: list.html has no floor, capacity, equipment or
// free-at controls, and the filter panel is deliberately not duplicated here —
// that would be a second implementation of everything, for the secondary page.
function readURL(){
  // ctx.groups is the groups *object*, keyed by parseFilters itself — passing
  // Object.keys(GROUPS) once validated every group against array indices and
  // dropped them all.
  const f=parseFilters(
    Object.fromEntries(new URLSearchParams(location.search)),
    {rooms:ROOMS, groups:GROUPS}
  );
  // The calendar's reading, for one meaning per link: an explicit room list
  // is the more specific statement and wins; with only groups named, the
  // groups stand for their rooms; with neither, every room.
  activeGroups=new Set(f.groups||[]);
  activeRooms=f.rooms?new Set(f.rooms)
    :activeGroups.size?groupRooms(activeGroups,GROUPS,ROOMS):new Set(ROOMS);
  searchQ=f.q;
  document.getElementById('search').value=f.q;
}
// replaceState, not pushState: with push, every chip click becomes a back-button
// step and leaving the page takes a dozen presses. Same rule as the calendar,
// and the same writing: rooms= only when it is not every room, groups= when
// any is picked. The state is the link — no translation between models.
function writeURL(){
  const p=new URLSearchParams();
  if(activeRooms.size&&activeRooms.size<ROOMS.length)p.set('rooms',[...activeRooms].join(','));
  if(activeGroups.size)p.set('groups',[...activeGroups].join(','));
  if(searchQ)p.set('q',searchQ);
  const qs=p.toString();
  history.replaceState(null,'',location.pathname+(qs?'?'+qs:''));
  syncLinks(qs?'?'+qs:'');
}
// The tab across to the calendar carries the same filters the page is
// showing. It used to be a fixed href with no query, so following it lost
// every filter you had set. (The toolbar's .ics/JSON export buttons are
// gone, and the server's /download endpoints went with them.)
//
// No from/to here, unlike the calendar: this page has no date window, it lists
// every booking that matches, so the trip back should carry the same set
// rather than one day of it.
//
// groups= stays in there. Do not drop it as an unused key: this page filters
// by group name (the calendar expands a group into rooms instead), so groups=
// is the *only* way the calendar's link learns which group you are looking
// at, and removing it puts the whole building back on the calendar.
function syncLinks(qs){
  document.getElementById('tab-cal').href='/'+qs;
}

// Say what the session actually is, rather than what the page would like it to
// be. This page owns no sign-in button — the calendar does — so when the
// session is gone it says so and points at the page that can fix it. The words
// are the calendar's, so the two pages cannot describe one session differently.
async function loadStatus(){
  const el=document.getElementById('sessBadge');
  try{
    // A stale tab stops asking — every answer from here on is the same 401 —
    // but the badge still says so.
    const r=TAB_STALE?null:await fetch('/api/status');
    if(staleTab(r)){
      el.className='badge bg-rd';el.textContent='● This tab is out of date';el.title=STALE_MSG;
      return;
    }
    const d=await r.json();
    if(d.session==='ok'){
      el.className='badge bg-gn';el.textContent='● Session active';
      el.title='LSM session is signed in';
    }else if(d.session==='expired'){
      el.className='badge bg-rd';el.textContent='● Session expired';
      el.title='Sign in from the Calendar page';
    }else if(d.session==='no_access'){
      el.className='badge bg-rd';el.textContent="● No access to LSM's report";
      el.title=d.session_message||'Ask the LSM administrator for access';
    }else{
      el.className='badge bg-og';el.textContent='● '+(d.session_message||'Session unknown');
      el.title='Sign in from the Calendar page';
    }
    // The update offer, from the same read — hidden unless something is
    // actually on offer, so the badge means an offer and nothing else. The
    // calendar pre-downloads a found release, so "ready" is the same offer
    // with the wait already paid.
    const upd=document.getElementById('updNote'),u=(d.update||{});
    if(u.state==='available'||u.state==='ready'){
      upd.style.display='inline-block';
      upd.textContent='⬆ Update available — install from the Calendar page';
      upd.title=u.latest_version||'';
    }else{upd.style.display='none';}
    // A scrape that ran behind this window — the 06:00 refresh while the
    // tab sat open — changed the store, while this page's EVENTS were
    // fetched once at boot. Without this the list keeps answering
    // yesterday's question, and a booking cancelled overnight stays on
    // it with nothing to say so. The calendar page adopted the same edge
    // for the same reason (EVENTS_AT there).
    const at=d.last_scrape;
    if(at){
      if(EVENTS_SCRAPE===null)EVENTS_SCRAPE=at;
      else if(at!==EVENTS_SCRAPE){EVENTS_SCRAPE=at;refreshBookings();}
    }
  }catch(e){
    // Back to unknown rather than leaving the last good reading standing: a
    // stale "active" is the exact claim this badge used to make unconditionally.
    el.className='badge bg-gr';el.textContent='● Session unknown';
    el.title='Could not reach the app';
  }
}

// Fetched once at boot, so a scrape that lands while the page is open has
// to be pulled in deliberately. The events and the room list are re-read —
// the room list is built from the bookings, so a scrape can add a room —
// and the groups are not: a scrape does not write them. calendar.html's
// refreshEvents, which this follows: a failed read keeps the list on screen
// (it used to become EVENTS=[] and "No events match"), and a selection of
// every room grows to take in a new room rather than hiding it under "All
// Rooms"; a deliberate narrowing is kept.
async function refreshBookings(){
  try{
    const r=await fetch('/api/bootstrap');
    if(staleTab(r)||!r.ok)return;
    const d=await r.json();
    const prev=activeRooms,hadAll=prev.size>=ROOMS.length;
    EVENTS=d.events||[];ROOMS=d.rooms||[];
    activeRooms=hadAll?new Set(ROOMS):new Set([...prev].filter(rm=>ROOMS.includes(rm)));
    // Every selected room gone is every room, not a blank list.
    if(!activeRooms.size)activeRooms=new Set(ROOMS);
    buildRoomFilter();
    renderStats();
    renderTags();
    render();
  }catch(e){
    // Deliberately quiet: the list on screen is still true as of its last
    // good read, and the badge above it catches its own failures. The
    // next scrape tick retries this.
  }
}

(async function boot(){
  // Not awaited: the bookings are the page, and the badge can arrive after
  // them. Starting it in parallel is why the list is not held up by a status
  // call it does not need.
  loadStatus();
  try{
    const r=keyed(await fetch('/api/bootstrap'));
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    EVENTS=d.events||[];ROOMS=d.rooms||[];GROUPS=d.groups||{};
    // GROUPS.Classroom was synthesized here as North ∪ South, which made the
    // config's own entry dead data and silently reverted any edit to the group.
    // The union lives in app/config.py now; the server is the source.
    buildRoomFilter();
    buildGroupBtns();
    renderStats();
    activeRooms=new Set(ROOMS);
    readURL();
    syncGroupBtns();
    syncRoomSelect();
    renderTags();
  }catch(e){
    // A Retry, as on the calendar, unless the tab is stale: reloading cannot
    // mend a key cookie, and the message already names what does.
    document.getElementById('list').innerHTML=TAB_STALE
      ?'<div class="empty">'+esc(STALE_MSG)+'</div>'
      :'<div class="empty">Could not load bookings: '+esc(e.message)
        +'<br><br><button class="btn" onclick="location.reload()">Retry</button></div>';
    return;
  }
  render();
})();

// The session is not a fact that is true once. The calendar re-reads it every
// minute, and this badge has to move on the same cadence or the two pages
// disagree about the same session for as long as a minute.
setInterval(loadStatus,60000);
</script>
</body>
</html>
